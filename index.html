<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#D6392F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>GRS 보수ON — 보수공사 접수·트래킹</title>
<link rel="manifest" href="./manifest.webmanifest">
<script>
/* PWA: 호스팅(https) 배포 시 앱 설치 지원 — 파일로 열 때는 자동 비활성 */
if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){
  window.addEventListener('load', ()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
window.deferredPrompt=null;
window.addEventListener('beforeinstallprompt', e=>{ e.preventDefault(); window.deferredPrompt=e; try{render()}catch(err){} });
function installApp(){ if(window.deferredPrompt){ window.deferredPrompt.prompt(); window.deferredPrompt=null; } }
</script>
<style>
  :root{
    --red:#D6392F; --red-dark:#B32B22; --red-bg:#FCEBEA;
    --ink:#1F2430; --sub:#6B7280; --line:#E5E7EB; --bg:#F4F5F7; --card:#FFFFFF;
    --green:#1E8E5A; --green-bg:#E6F4EC; --amber:#B45309; --amber-bg:#FEF3E2;
    --blue:#2563EB; --blue-bg:#EAF0FE; --gray-bg:#EEF0F3;
    --radius:14px; --shadow:0 1px 3px rgba(16,24,40,.08),0 1px 2px rgba(16,24,40,.04);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5}
  button{font-family:inherit;cursor:pointer;border:none;background:none;font-size:14px}
  input,select,textarea{font-family:inherit;font-size:15px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;background:#fff}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--red);outline-offset:-1px;border-color:var(--red)}
  label{font-size:13px;font-weight:700;color:var(--sub);display:block;margin:14px 0 6px}

  header{background:var(--red);color:#fff;position:sticky;top:0;z-index:50;box-shadow:var(--shadow)}
  .hd-top{display:flex;align-items:center;gap:10px;padding:12px 16px;max-width:960px;margin:0 auto}
  .logo{font-weight:800;font-size:18px;letter-spacing:-.3px;white-space:nowrap}
  .logo small{font-weight:500;font-size:11px;opacity:.85;display:block;letter-spacing:0}
  .hd-spacer{flex:1}
  .whoami{font-size:12px;font-weight:700;background:rgba(255,255,255,.18);border-radius:99px;padding:6px 12px;white-space:nowrap;max-width:150px;overflow:hidden;text-overflow:ellipsis}
  .role-sel{width:auto;max-width:150px;border:none;border-radius:10px;padding:8px 10px;font-size:13px;font-weight:700;color:var(--red-dark);background:#fff}
  .bell{position:relative;padding:8px;border-radius:10px;color:#fff;font-size:20px;line-height:1}
  .bell:active{background:rgba(255,255,255,.2)}
  .bell .cnt{position:absolute;top:2px;right:0;background:#FFD028;color:#7A2E00;font-size:10px;font-weight:800;border-radius:9px;min-width:17px;height:17px;display:flex;align-items:center;justify-content:center;padding:0 4px}
  nav{display:flex;max-width:960px;margin:0 auto;overflow-x:auto}
  nav button{color:rgba(255,255,255,.75);font-weight:700;padding:10px 14px;border-bottom:3px solid transparent;white-space:nowrap;font-size:14px}
  nav button.on{color:#fff;border-bottom-color:#FFD028}

  main{max-width:960px;margin:0 auto;padding:16px 14px 90px}

  .card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:12px}
  .badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:800;border-radius:99px;padding:3px 10px;white-space:nowrap}
  .b-red{background:var(--red-bg);color:var(--red-dark)} .b-green{background:var(--green-bg);color:var(--green)}
  .b-amber{background:var(--amber-bg);color:var(--amber)} .b-blue{background:var(--blue-bg);color:var(--blue)}
  .b-purple{background:#EFE7FB;color:#6B34B8}
  .b-gray{background:var(--gray-bg);color:var(--sub)}
  .b-overdue{background:var(--red);color:#fff}
  .urgent{background:#7C1D18;color:#fff}

  .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
  .tile{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 12px;text-align:center}
  .tile .n{font-size:26px;font-weight:800;letter-spacing:-1px}
  .tile .t{font-size:12px;color:var(--sub);font-weight:700;margin-top:2px}
  .tile.alert .n{color:var(--red)}
  button.tile{cursor:pointer;text-align:center;width:100%}
  button.tile:active{transform:scale(.97);box-shadow:0 0 0 2px var(--red-bg)}
  button.stagebar:active{background:var(--gray-bg);border-radius:6px}
  .h2{font-size:15px;font-weight:800;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}
  .stagebar{display:flex;align-items:center;gap:10px;margin-bottom:9px;font-size:13px}
  .stagebar .nm{width:88px;color:var(--sub);font-weight:700;flex-shrink:0}
  .stagebar .tr{flex:1;background:var(--gray-bg);border-radius:6px;height:14px;overflow:hidden}
  .stagebar .fl{height:100%;background:var(--red);border-radius:6px;min-width:2px}
  .stagebar .v{width:24px;text-align:right;font-weight:800}

  .filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;-webkit-overflow-scrolling:touch}
  .chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 13px;font-weight:700;font-size:13px;color:var(--sub);white-space:nowrap}
  .chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .search{margin-bottom:10px}
  .req{display:block;width:100%;text-align:left}
  .req .row1{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
  .req .id{font-size:12px;color:var(--sub);font-weight:700}
  .req h3{font-size:15px;font-weight:800;margin-bottom:2px}
  .req .meta{font-size:12.5px;color:var(--sub)}
  .req .row2{display:flex;align-items:center;justify-content:space-between;margin-top:10px;gap:8px}
  .minibar{flex:1;display:flex;gap:3px}
  .minibar i{flex:1;height:5px;border-radius:3px;background:var(--gray-bg)}
  .minibar i.done{background:var(--green)} .minibar i.cur{background:var(--red)}
  .dday{font-size:12px;font-weight:800}

  .back{color:var(--sub);font-weight:700;margin-bottom:10px;font-size:14px}
  .stepper{display:flex;margin:14px 0 4px}
  .step{flex:1;text-align:center;position:relative;font-size:10.5px;font-weight:700;color:var(--sub)}
  .step .dot{width:24px;height:24px;border-radius:50%;background:var(--gray-bg);color:var(--sub);display:flex;align-items:center;justify-content:center;margin:0 auto 4px;font-size:12px;font-weight:800;position:relative;z-index:2}
  .step::before{content:'';position:absolute;top:12px;left:-50%;width:100%;height:2px;background:var(--gray-bg);z-index:1}
  .step:first-child::before{display:none}
  .step.done .dot{background:var(--green);color:#fff} .step.done::before{background:var(--green)}
  .step.cur .dot{background:var(--red);color:#fff;box-shadow:0 0 0 4px var(--red-bg)} .step.cur::before{background:var(--green)}
  .step.cur{color:var(--red-dark)}
  .sec{border-top:1px solid var(--line);padding:14px 0}
  .sec:last-child{padding-bottom:0}
  .sec .st{font-weight:800;font-size:14px;margin-bottom:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .kv{display:flex;font-size:14px;margin-bottom:5px}
  .kv b{width:92px;color:var(--sub);font-weight:700;flex-shrink:0;font-size:13px}
  .photos{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .photos img{width:86px;height:86px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--red);color:#fff;font-weight:800;border-radius:10px;padding:11px 16px;font-size:14px}
  .btn:active{background:var(--red-dark)}
  .btn:disabled{opacity:.5}
  .btn.sec2{background:var(--gray-bg);color:var(--ink)}
  .btn.grn{background:var(--green)}
  .btn.sm{padding:7px 12px;font-size:13px}
  .btn.blk{width:100%;margin-top:10px}
  .file-add{border:2px dashed var(--line);border-radius:10px;padding:14px;text-align:center;color:var(--sub);font-weight:700;font-size:13px;width:100%}
  .note{font-size:12.5px;color:var(--sub);background:var(--gray-bg);border-radius:8px;padding:8px 10px;margin-top:8px}
  .warn{background:var(--red-bg);color:var(--red-dark);font-weight:700}
  .spin.dk{border-color:rgba(0,0,0,.18);border-top-color:var(--sub)}
  .imgfail{width:86px;height:86px;border-radius:10px;border:1px dashed var(--line);background:var(--gray-bg);color:var(--sub);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;text-align:center;padding:4px}
  .filebox{margin-top:10px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .filehd{background:var(--gray-bg);font-size:12px;font-weight:800;color:var(--sub);padding:7px 11px}
  .filerow{display:flex;align-items:center;gap:8px;padding:9px 11px;border-top:1px solid var(--line);flex-wrap:wrap}
  .filerow .fname{flex:1;min-width:150px;font-size:13px;font-weight:700;word-break:break-all}
  .filerow .fmeta{display:block;font-size:11px;color:var(--sub);font-weight:500;margin-top:1px}
  .filerow .facts{display:flex;gap:6px;flex-shrink:0}
  .btn.dl{background:var(--ink)}
  .btn.delx{background:var(--red-bg);color:var(--red-dark)}
  /* 시스템 전환 (보수공사 ↔ 조명·타일 발주) */
  .appsw{display:flex;gap:6px;padding:8px 14px 0;background:var(--red)}
  .appsw button{flex:1;padding:9px 6px;border-radius:10px 10px 0 0;font-weight:800;font-size:13.5px;background:rgba(255,255,255,.16);color:rgba(255,255,255,.85)}
  .appsw button.on{background:#fff;color:var(--red-dark)}
  /* 발주 — 품목 표 */
  .itab{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:8px}
  .itab th{background:var(--gray-bg);color:var(--sub);font-size:11.5px;font-weight:800;padding:7px 6px;text-align:left;white-space:nowrap}
  .itab td{padding:7px 6px;border-top:1px solid var(--line);vertical-align:top}
  .itab td.num,.itab th.num{text-align:right;white-space:nowrap}
  .itab tfoot td{border-top:2px solid var(--ink);font-weight:800;background:var(--gray-bg)}
  .tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .oline{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:4px}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .chips button{padding:6px 11px;border-radius:99px;background:var(--gray-bg);color:var(--sub);font-weight:700;font-size:12.5px}
  .chips button.on{background:var(--ink);color:#fff}
  .kindtab{display:flex;gap:8px;margin-bottom:14px}
  .kindtab button{flex:1;padding:12px 8px;border-radius:12px;border:2px solid var(--line);background:#fff;font-weight:800;font-size:13.5px;color:var(--sub);line-height:1.35}
  .kindtab button.on{border-color:var(--red);background:var(--red-bg);color:var(--red-dark)}
  .kindtab button small{display:block;font-weight:500;font-size:11px;margin-top:2px;opacity:.85}
  /* 표준 품목 선택기 */
  .specrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 6px;border-bottom:1px solid var(--line)}
  .specrow:active{background:var(--gray-bg)}
  .specrow img{width:46px;height:46px;object-fit:contain;border:1px solid var(--line);border-radius:8px;background:#fff;flex-shrink:0}
  .specrow .si{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
  .specrow .si b{font-size:12.5px}
  .specrow .si span{font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .specrow .si .sm{font-size:11.5px;color:var(--sub)}
  .specrow .sp{flex-shrink:0;font-weight:800;font-size:13px;text-align:right}
  .specrow .sp small{display:block;font-weight:500;font-size:10.5px;color:var(--sub)}
  /* 견적 입력 행 */
  .qrow{border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:8px}
  .qhd{display:flex;align-items:flex-start;gap:8px}
  .qhd img{width:42px;height:42px;object-fit:contain;border:1px solid var(--line);border-radius:8px;background:#fff;flex-shrink:0}
  .qnoimg{width:42px;height:42px;display:flex;align-items:center;justify-content:center;background:var(--gray-bg);border-radius:8px;flex-shrink:0}
  .qhd .qt{flex:1;min-width:0;font-size:13px;line-height:1.4}
  .qhd .qs{font-size:11.5px;color:var(--sub);margin-top:1px}
  .qdel{color:var(--red-dark);font-weight:800;font-size:12px;flex-shrink:0}
  .itab .ic{width:38px;height:38px;object-fit:contain;border:1px solid var(--line);border-radius:6px;background:#fff}
  /* 로그인 화면 — 카카오 안내 */
  .kakao{margin-top:12px;background:#FEE500;border-radius:12px;padding:12px 14px;text-align:center}
  .kakao .kk-t{font-size:13px;font-weight:800;color:#3C1E1E;margin-bottom:4px}
  .kakao a{font-size:12.5px;font-weight:700;color:#3C1E1E;text-decoration:underline;word-break:break-all}
  /* 개선요청 게시판 */
  .bdrow{width:100%;text-align:left;padding:12px 0;border-top:1px solid var(--line)}
  .bdrow:first-child{border-top:none}
  .bdrow h4{font-size:14.5px;font-weight:800;margin:4px 0 2px}
  .bdrow .bm{font-size:12px;color:var(--sub)}
  .bdbody{white-space:pre-wrap;font-size:14px;line-height:1.55}
  .reply{background:var(--blue-bg);border-radius:10px;padding:10px 12px;margin-top:8px}
  .reply .who{font-size:12px;font-weight:800;color:var(--blue);margin-bottom:2px}
  .togrow{display:flex;align-items:center;gap:10px;background:var(--gray-bg);border-radius:12px;padding:11px 13px;margin-bottom:8px}
  .togrow .tl{flex:1;font-weight:800;font-size:14px}
  .togrow .tl div{font-size:11.5px;color:var(--sub);font-weight:500;margin-top:1px}
  .swi{width:52px;height:28px;border-radius:99px;position:relative;transition:.2s;flex-shrink:0}
  .swi span{position:absolute;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:.2s}

  .cmt{background:var(--gray-bg);border-radius:10px;padding:10px 12px;margin-bottom:8px}
  .cmt .who{font-size:12px;font-weight:800;margin-bottom:2px}
  .cmt .who span{color:var(--sub);font-weight:500;margin-left:6px}
  .hist{position:relative;padding-left:18px}
  .hist::before{content:'';position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--line)}
  .hitem{position:relative;padding-bottom:12px;font-size:13px}
  .hitem::before{content:'';position:absolute;left:-17px;top:5px;width:8px;height:8px;border-radius:50%;background:var(--red)}
  .hitem .ts{color:var(--sub);font-size:11.5px}

  .panel{position:fixed;inset:0;background:rgba(15,18,25,.45);z-index:100;display:none}
  .panel.open{display:block}
  .panel-in{position:absolute;right:0;top:0;bottom:0;width:min(360px,92vw);background:#fff;padding:16px;overflow-y:auto}
  .panel-in h2{font-size:16px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
  .noti{border-left:4px solid var(--line);padding:9px 12px;margin-bottom:8px;background:var(--gray-bg);border-radius:0 10px 10px 0;font-size:13.5px}
  .noti.over{border-left-color:var(--red);background:var(--red-bg)}
  .noti .ts{font-size:11.5px;color:var(--sub);margin-top:2px}

  .modal{position:fixed;inset:0;background:rgba(15,18,25,.5);z-index:110;display:none;align-items:flex-end;justify-content:center}
  .modal.open{display:flex}
  .modal-in{background:#fff;border-radius:18px 18px 0 0;width:100%;max-width:560px;max-height:88vh;overflow-y:auto;padding:20px 18px 26px}
  .modal-in h2{font-size:17px;margin-bottom:4px}
  .modal-in .sub{font-size:13px;color:var(--sub)}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-weight:700;font-size:14px;padding:11px 20px;border-radius:99px;z-index:200;box-shadow:var(--shadow);display:none;white-space:nowrap}

  .role-note{background:var(--blue-bg);color:var(--blue);font-size:12.5px;font-weight:700;border-radius:10px;padding:9px 12px;margin-bottom:12px}
  .empty{text-align:center;color:var(--sub);padding:40px 0;font-weight:700}
  .sysbar{background:#7A2E00;color:#FFE9B8;font-size:12.5px;font-weight:700;text-align:center;padding:7px 12px}
  .sysbar.err{background:var(--red-dark);color:#fff}

  /* ===== 로그인 ===== */
  #login{position:fixed;inset:0;background:linear-gradient(160deg,var(--red) 0%,#A32218 100%);z-index:300;display:none;align-items:center;justify-content:center;padding:20px;overflow-y:auto}
  #login.open{display:flex}
  .login-card{background:#fff;border-radius:20px;padding:28px 22px;width:100%;max-width:400px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
  .login-card .lg{text-align:center;margin-bottom:6px;font-size:24px;font-weight:800;color:var(--red-dark);letter-spacing:-.5px}
  .login-card .ds{text-align:center;font-size:13px;color:var(--sub);margin-bottom:18px}
  .rolebtns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .rolebtn{border:2px solid var(--line);border-radius:12px;padding:12px 4px;text-align:center;font-weight:800;font-size:13px;background:#fff}
  .rolebtn .em{font-size:22px;display:block;margin-bottom:4px}
  .rolebtn.on{border-color:var(--red);background:var(--red-bg);color:var(--red-dark)}
  .login-err{color:var(--red-dark);font-size:13px;font-weight:700;margin-top:10px;text-align:center;display:none}

  .spin{display:inline-block;width:16px;height:16px;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-3px}
  @keyframes sp{to{transform:rotate(360deg)}}
  /* ===== 서명 ===== */
  .sgwrap{border:2px dashed var(--line);border-radius:12px;background:#fff;margin-top:8px;position:relative}
  .sgwrap canvas{display:block;width:100%;height:190px;border-radius:12px;touch-action:none}
  .sghint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#C9CDD4;font-weight:800;pointer-events:none;font-size:15px}
  .signimg{background:#fff;border:1px solid var(--line);border-radius:10px;max-width:260px;width:100%;margin-top:6px}

  /* ===== 채팅 ===== */
  .roomrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left}
  .roomrow .rmain{flex:1;min-width:0}
  .roomrow .rname{font-weight:800;font-size:15px}
  .roomrow .rlast{font-size:12.5px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .roomrow .rright{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0}
  .roomrow .rts{font-size:11px;color:var(--sub);flex-shrink:0}
  /* 미확인 채팅 */
  .roomrow.unread{border-left:4px solid var(--red);background:#FFF8F7}
  .roomrow.unread .rname{color:var(--red-dark)}
  .roomrow.unread .rlast{color:var(--ink);font-weight:700}
  .ubadge{background:var(--red);color:#fff;border-radius:99px;font-size:11px;font-weight:800;padding:2px 8px;min-width:20px;text-align:center;flex-shrink:0}
  .unsum{background:#FFF3CD;border:1px solid #FFD028;border-radius:var(--radius);padding:11px 13px;margin-bottom:12px}
  .unsum .ut{font-size:13.5px;font-weight:800;color:#7A2E00;margin-bottom:8px}
  .unsum .urow{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:7px 0;border-top:1px solid rgba(122,46,0,.15)}
  .unsum .urow .un{font-weight:800;font-size:13px;flex-shrink:0;max-width:38%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .unsum .urow .ul{flex:1;min-width:0;font-size:12.5px;color:#7A2E00;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .unsum .umore{font-size:11.5px;color:#7A2E00;padding-top:6px;opacity:.8}

function waitFB(ms=12000){
  return new Promise((res,rej)=>{
    const check = ()=>{ if(window.FB) res(); else rej(new Error(window.FB_LOAD_ERROR||'SDK 로드 실패 — 인터넷 연결을 확인하세요')); };
    if(window.FB || window.FB_LOAD_ERROR) return check();
    const t = setTimeout(check, ms);
    window.addEventListener('fb-ready', ()=>{ clearTimeout(t); check(); }, {once:true});
  });
}
const store = {
  async init(onReqs){
    if(LIVE){
      await waitFB();
      const app = FB.initializeApp(FIREBASE_CONFIG);
      await FB.signInAnonymously(FB.getAuth(app));
      fs = FB.getFirestore(app, FIRESTORE_DB_ID);
      // 설정 문서 구독
      FB.onSnapshot(FB.doc(fs,'config','app'), d=>{
        if(d.exists()){
          const c=d.data();
          state.cfg.codes = Object.assign({...DEFAULT_CODES}, c.codes||{});
          state.cfg.sla = Object.assign({...DEFAULT_SLA}, c.sla||{});
          if(Array.isArray(c.stores)&&c.stores.length) state.cfg.stores=c.stores.map(x=>String(x).trim()).filter(Boolean);
          if(Array.isArray(c.builders)&&c.builders.length) state.cfg.builders=c.builders.map(x=>String(x).trim()).filter(Boolean);
          state.cfg.builderCodes = c.builderCodes || {};
          state.cfg.osla = Object.assign({...DEFAULT_O_SLA}, c.osla||{});
          if(c.lightContract) state.cfg.lightContract = c.lightContract;
          if(Array.isArray(c.labor)&&c.labor.length) state.cfg.labor=c.labor.map(x=>Array.isArray(x)?[String(x[0]),+x[1]]:[String(x.j),+x.r]);
          if(c.laborNote) state.cfg.laborNote=c.laborNote;
        }
        fillStoreList(); if(state.ready) render();
      }, err=>console.warn('config',err));
      // 접수건 실시간 구독은 로그인 후 역할에 맞춰 시작 (subscribeReqs)
      if(state.user) subscribeReqs(onReqs);

  async saveConfig(patch){
    Object.assign(state.cfg, patch);

      const out = {...patch};
      /* Firestore는 중첩 배열을 허용하지 않으므로 노임단가는 {j,r} 객체 배열로 변환 */
      if(Array.isArray(out.labor)) out.labor = out.labor.map(x=>Array.isArray(x)?{j:String(x[0]),r:+x[1]}:x);
      await FB.setDoc(FB.doc(fs,'config','app'), out, {merge:true});
    }
  },
  async saveRequest(r){
    if(LIVE) await FB.setDoc(FB.doc(fs,'requests',r.id), r);
    else { state.reqs.unshift(r); }
  },
  async updateRequest(id, patch, histEntry, comment){
    /* 파트너 평가용: 단계가 넘어갈 때 기한초과였다면 지연 이력 기록 */
    const cur = R(id);
    let overdueEntry = null;
    if(cur && patch.stage && patch.stage!==cur.stage && isOver(cur))
      overdueEntry = {stage:cur.stage, days:-ddays(cur), ts:now()};
    if(LIVE){
      const upd = {...patch};
      if(histEntry) upd.history = FB.arrayUnion(histEntry);
      if(comment) upd.comments = FB.arrayUnion(comment);
      if(overdueEntry) upd.overdues = FB.arrayUnion(overdueEntry);
      await FB.updateDoc(FB.doc(fs,'requests',id), upd);
    } else {
      if(overdueEntry){ const rr=state.reqs.find(x=>x.id===id); rr.overdues=(rr.overdues||[]); rr.overdues.push(overdueEntry); }
      const r = state.reqs.find(x=>x.id===id);
      Object.assign(r, patch);
      if(histEntry) r.history.push(histEntry);
      if(comment) r.comments.push(comment);
    }
  },
  async addFile(reqId, file){ // file={kind,name,data,ts} — reqId가 'O:xxx'면 발주건
    if(file && file.data && file.data.length > MAX_FILE_CHARS)
      throw new Error(`파일 용량 초과 (${Math.round(file.data.length/1024)}KB / 최대 ${Math.round(MAX_FILE_CHARS/1024)}KB)`);
    if(LIVE){ const [c,d] = filesPath(reqId); await FB.addDoc(FB.collection(fs,c,d,'files'), file); }
    if(!filesCache[reqId]) filesCache[reqId]=[];
    filesCache[reqId].push(file);
    filesLoaded[reqId] = true; filesErr[reqId] = null;
  },
  /* 한 번 조회 — 실패하면 캐시에 남기지 않고 오류를 기록해 재시도가 가능하게 한다 */
  async getFiles(reqId, force){
    if(!force && filesLoaded[reqId]) return filesCache[reqId]||[];
    if(!LIVE){ filesCache[reqId] = filesCache[reqId]||[]; filesLoaded[reqId]=true; return filesCache[reqId]; }
    const [pc,pd] = filesPath(reqId);
    const pull = async (useOrder) => {
      const col = FB.collection(fs,pc,pd,'files');
      const snap = await FB.getDocs(useOrder ? FB.query(col, FB.orderBy('ts')) : col);
      return snap.docs.map(d=>d.data()).sort((a,b)=>(a.ts||0)-(b.ts||0));
    };
    try{
      filesCache[reqId] = await pull(true);
      filesLoaded[reqId] = true; filesErr[reqId] = null;
    }catch(e){
      /* ts 필드 누락 등 정렬 실패 대비 — 정렬 없이 한 번 더 시도 */
      try{
        filesCache[reqId] = await pull(false);
        filesLoaded[reqId] = true; filesErr[reqId] = null;
      }catch(e2){
        filesErr[reqId] = e2.code || e2.message || String(e2);
        console.warn('getFiles', reqId, e2);
      }
    }
    return filesCache[reqId]||[];
  },
  /* 첨부파일 삭제 — 잘못 올린 사진을 지운다 */
  async deleteFile(reqId, file){
    if(LIVE){
      const [c,d] = filesPath(reqId);
      const snap = await FB.getDocs(FB.collection(fs,c,d,'files'));
      const hit = snap.docs.find(x=>{
        const v = x.data();
        return v.ts===file.ts && v.kind===file.kind && v.name===file.name;
      });
      if(hit) await FB.deleteDoc(FB.doc(fs,c,d,'files',hit.id));
    }
    const arr = filesCache[reqId]||[];
    const i = arr.findIndex(f=>f.ts===file.ts && f.kind===file.kind && f.name===file.name);
    if(i>=0) arr.splice(i,1);
  },
  /* 실시간 구독 — 다른 사람이 올린 사진·견적서가 새로고침 없이 바로 보인다 */
  subscribeFiles(reqId, cb){
    if(!LIVE){ filesLoaded[reqId]=true; cb(); return ()=>{}; }
    let unsub = null;
    const [sc,sd] = filesPath(reqId);
    try{
      unsub = FB.onSnapshot(FB.collection(fs,sc,sd,'files'),
        snap=>{
          filesCache[reqId] = snap.docs.map(d=>d.data()).sort((a,b)=>(a.ts||0)-(b.ts||0));
          filesLoaded[reqId] = true; filesErr[reqId] = null;
          cb();
        },
        err=>{
          filesErr[reqId] = err.code || String(err);
          console.warn('subscribeFiles', reqId, err);
          /* 구독이 막히면 1회 조회로 폴백 */
          store.getFiles(reqId, true).then(cb).catch(()=>cb());
        });
    }catch(e){
      filesErr[reqId] = e.code || e.message || String(e);
      store.getFiles(reqId, true).then(cb).catch(()=>cb());
    }
    return ()=>{ if(unsub){ try{unsub()}catch(e){} } };
  },
  /* ---- 조명·타일 발주 ---- */
  async saveOrder(o){
    if(LIVE) await FB.setDoc(FB.doc(fs,'orders',o.id), o);
    else state.orders.unshift(o);
  },
  async updateOrder(id, patch, histEntry){
    if(LIVE){
      const upd = {...patch};
      if(histEntry) upd.history = FB.arrayUnion(histEntry);
      await FB.updateDoc(FB.doc(fs,'orders',id), upd);
      /* 실시간 구독이 돌아오기 전에도 화면이 바로 반영되도록 로컬에도 적용 */
      const o = O(id);
      if(o){ Object.assign(o, patch); if(histEntry) (o.history=o.history||[]).push(histEntry); }
    } else {
      const o = O(id); if(!o) return;
      Object.assign(o, patch);
      if(histEntry) (o.history=o.history||[]).push(histEntry);
    }
  },
  async addOrderComment(id, cm){
    if(LIVE) await FB.updateDoc(FB.doc(fs,'orders',id), {comments:FB.arrayUnion(cm)});
    const o = O(id);
    if(o) (o.comments = o.comments||[]).push(cm);
  },
  /* ---- 개선요청 게시판 ---- */
  async savePost(p){
    if(LIVE) await FB.setDoc(FB.doc(fs,'posts',p.id), p);
    else state.posts.unshift(p);
  },
  async updatePost(id, patch){
    if(LIVE) await FB.updateDoc(FB.doc(fs,'posts',id), patch);
    const p = (state.posts||[]).find(x=>x.id===id);
    if(p) Object.assign(p, patch);
  },
  async addReply(id, r){
    if(LIVE) await FB.updateDoc(FB.doc(fs,'posts',id), {replies:FB.arrayUnion(r)});
    const p = (state.posts||[]).find(x=>x.id===id);
    if(p) (p.replies=p.replies||[]).push(r);
  },
  async deletePost(id){
    if(LIVE) await FB.deleteDoc(FB.doc(fs,'posts',id));
    const i = (state.posts||[]).findIndex(x=>x.id===id);
    if(i>=0) state.posts.splice(i,1);
  },
  /* ---- 채팅 ---- */
  subscribeRooms(cb){
    if(LIVE){
      if(role()==='store'){
        const names = ['전체', state.user.store||state.user.name];
        const metas = {};
        const unsubs = names.map(n=>FB.onSnapshot(FB.doc(fs,'chats',n), d=>{
          if(d.exists()) metas[n]={id:n, ...d.data()};
          cb(Object.values(metas));
        }, err=>console.warn('room',err)));
        return ()=>unsubs.forEach(u=>{try{u()}catch(e){}});
      }
      return FB.onSnapshot(FB.query(FB.collection(fs,'chats'), FB.orderBy('lastTs','desc'), FB.limit(100)),
        snap=>cb(snap.docs.map(d=>({id:d.id, ...d.data()}))), err=>console.warn('rooms',err));
    }
    demoChats.roomCb = cb; cb(demoRoomMetas()); return ()=>{demoChats.roomCb=null};
  },
  subscribeMsgs(room, cb){
    if(LIVE) return FB.onSnapshot(FB.query(FB.collection(fs,'chats',room,'messages'), FB.orderBy('ts'), FB.limit(300)),
      snap=>cb(snap.docs.map(d=>d.data())), err=>console.warn('msgs',err));
    demoChats.msgCb = {room, cb}; cb((demoChats.msgs[room]||[]).slice()); return ()=>{demoChats.msgCb=null};
  },
  async sendMsg(room, msg){
    if(LIVE){
      await FB.addDoc(FB.collection(fs,'chats',room,'messages'), msg);
      await FB.setDoc(FB.doc(fs,'chats',room),
        {name:room, lastMsg:msg.text, lastTs:msg.ts, lastBy:msg.author, msgN:FB.increment(1)}, {merge:true});
    } else {
      if(!demoChats.msgs[room]) demoChats.msgs[room]=[];
      demoChats.msgs[room].push(msg);
      const prevN = (demoChats.meta[room]||{}).msgN || 0;
      demoChats.meta[room] = {name:room, lastMsg:msg.text, lastTs:msg.ts, lastBy:msg.author, msgN:prevN+1};
      if(demoChats.msgCb && demoChats.msgCb.room===room) demoChats.msgCb.cb(demoChats.msgs[room].slice());
      if(demoChats.roomCb) demoChats.roomCb(demoRoomMetas());
    }
  }
};
/* 역할별 접수건 구독 — 점포는 자기 점포 것만 받아 서버 사용량을 대폭 줄임 (1,500개 점포 대응) */
function subscribeReqs(onReqs){
  if(!LIVE) return;
  if(state.unsubReqs){ try{state.unsubReqs()}catch(e){} state.unsubReqs=null; }
  onReqs = onReqs || (()=>render());
  let q;
  if(role()==='store' && state.user.store){
    q = FB.query(FB.collection(fs,'requests'), FB.where('store','==',state.user.store), FB.limit(200));
  } else {
    q = FB.query(FB.collection(fs,'requests'), FB.orderBy('createdAt','desc'), FB.limit(500));
  }
  state.unsubReqs = FB.onSnapshot(q, snap=>{
    const list = snap.docs.map(d=>d.data()).sort((a,b)=>b.createdAt-a.createdAt);
    try{ detectReqNotis(list); }catch(e){ console.warn('noti', e); }
    state.reqs = list;
    state.ready = true; state.dbError=null;
    onReqs();
  }, err=>{ state.dbError = err.code||String(err); state.ready=true; onReqs(); });
}

/* 개선요청 게시판 구독 — 모든 사용자 공통 */

/* 발주건 실시간 구독 — 공급사·시공사는 자기 건만 받는다 */
function subscribeOrders(onOrders){
  if(!LIVE || !state.user) return;
  /* 발주 탭이 하나라도 보이는 역할만 구독한다.
     ※ 2026-08-26 탭 분리 전에는 canApp('order') 였는데, 앱 이름이 light/tile 로 갈리면서
        항상 false 가 되어 발주가 아예 로딩되지 않았다. isOrderApp 기준으로 판정한다. */
  if(!myApps().some(isOrderApp)) return;
  if(state.unsubOrders){ try{state.unsubOrders()}catch(e){} state.unsubOrders=null; }
  onOrders = onOrders || (()=>render());
  const col = FB.collection(fs,'orders');
  let q;
  if(role()==='supplier')      q = FB.query(col, FB.where('supplier','==',myCo()), FB.limit(500));
  else if(role()==='builder')  q = FB.query(col, FB.where('builder','==',myCo()), FB.limit(500));
  else                         q = FB.query(col, FB.orderBy('createdAt','desc'), FB.limit(500));
  state.unsubOrders = FB.onSnapshot(q, snap=>{
    const list = snap.docs.map(d=>normOrder(d.data())).sort((a,b)=>b.createdAt-a.createdAt);
    try{ detectOrderNotis(list); }catch(e){ console.warn('onoti', e); }
    state.orders = list;
    state.ordersReady = true; state.orderErr = null;
    onOrders();
  }, err=>{ state.orderErr = err.code||String(err); state.ordersReady=true; onOrders(); });
}
/* 발주 진행상황 알림 — 보수와 같은 방식 */
function detectOrderNotis(list){
  const me = actorLabel();
  const fresh = [];
  list.forEach(o=>{
    const hist = o.history||[];
    const sig = { n:hist.length, stage:o.stage };
    const prev = state.prevOrderSig[o.id];
    state.prevOrderSig[o.id] = sig;
    if(!state.ordersInit || !prev) return;
    if(!state.reqNoti) return;
    if(state.reqNotiMine && !O_STAGES.some(s=>oCanAct(o,s))) return;
    if(sig.n > prev.n){
      const last = hist[hist.length-1];
      if(last && last.actor !== me){
        const mine = O_STAGES.some(s=>oCanAct(o,s));
        fresh.push({ title:`${CAT_ICON[o.cat]} ${o.site} · ${o.cat} 발주`,
                     body:`${last.action} (${last.actor})${mine?'\n▶ 내 조치가 필요합니다':''}`,
                     tag:'ord-'+o.id, id:o.id });
      }
    }
  });
  state.ordersInit = true;
  if(fresh.length > 3) showNotif('📦 발주 진행상황', `${fresh.length}건이 업데이트되었습니다`, 'obulk', null);
  else fresh.forEach(f=>showNotif(f.title, f.body, f.tag, null));
}

/* ============ 진행상황 알림 ============
   접수건 실시간 구독 결과를 직전 상태와 비교해 "새로 생긴 변화"만 골라 알린다.
   (앱이 열려 있거나 백그라운드 탭일 때 동작) */
function notiRelevant(r){
  const rl = role();
  if(rl==='vendor') return reqVendor(r)===myCo();
  if(rl==='store')  return !state.user.store || r.store===state.user.store;
  return true; // 본사담당은 전체
}
/* 내가 다음으로 조치해야 하는 건인지 */
function needsMyAction(r){
  const rl = role();
  if(r.stage==='DONE' || r.stage==='DROPPED') return rl==='store' && r.stage==='DONE' && !r.signBy;
  if(r.stage==='SCHEDULE' && r.schedStatus==='제안') return rl==='store';
  const owner = STAGE_OWNER[r.stage];
  return (owner==='본사담당' && rl==='hq') || (owner==='시공업체' && rl==='vendor');
}
function detectReqNotis(list){
  const me = actorLabel();
  const fresh = [];
  list.forEach(r=>{
    const hist = r.history||[];
    const cmts = r.comments||[];
    const sig = { n:hist.length, c:cmts.length, stage:r.stage };
    const prev = state.prevReqSig[r.id];
    state.prevReqSig[r.id] = sig;
    if(!state.reqsInit || !prev) return;               // 첫 로딩분은 알리지 않음
    if(!state.reqNoti || !notiRelevant(r)) return;
    if(state.reqNotiMine && !needsMyAction(r)) return; // "내 조치 필요분만" 옵션

    if(sig.n > prev.n){
      const last = hist[hist.length-1];
      if(last && last.actor !== me){
        const icon = r.stage==='DONE' ? '🏁' : sig.stage!==prev.stage ? '📌' : '🔔';
        fresh.push({
          title: `${icon} ${r.store} · ${r.title||r.id}`,
          body : `${last.action} (${last.actor})${needsMyAction(r)?'\n▶ 내 조치가 필요합니다':''}`,
          tag  : 'req-'+r.id, reqId: r.id
        });
      }
    } else if(sig.c > prev.c){
      const cm = cmts[cmts.length-1];
      if(cm && cm.author !== me)
        fresh.push({ title:`💬 ${r.store} · 새 의견`, body:`${cm.author}: ${cm.text}`, tag:'cmt-'+r.id, reqId:r.id });
    }
  });
  state.reqsInit = true;
  /* 한 번에 여러 건이 바뀌면 개별 알림 대신 요약 1건 */
  if(fresh.length > 3){
    showNotif('🔔 보수ON 진행상황', `${fresh.length}건이 업데이트되었습니다`, 'bulk', null);
  } else {
    fresh.forEach(f=>showNotif(f.title, f.body, f.tag, f.reqId));
  }
}

/* ================= 이미지 압축 ================= */
/* 저장 한도(900KB)를 넘지 않을 때까지 자동으로 화질·크기를 낮춘다 —
   한도를 넘긴 사진은 Firestore 저장이 실패해 "다른 사람에게 안 보이는" 원인이 된다 */
function compressImage(file, maxW=1000, quality=0.65){
  return new Promise((res,rej)=>{
    const rd = new FileReader();
    rd.onload = ev => {
      const img = new Image();
      img.onload = () => {
        try{
          let w = maxW, q = quality, out = '';
          for(let i=0;i<7;i++){
            const scale = Math.min(1, w/img.width);
            const cv = document.createElement('canvas');
            cv.width  = Math.max(1, Math.round(img.width*scale));
            cv.height = Math.max(1, Math.round(img.height*scale));
            const cx = cv.getContext('2d');
            cx.fillStyle = '#fff'; cx.fillRect(0,0,cv.width,cv.height);
            cx.drawImage(img,0,0,cv.width,cv.height);
            out = cv.toDataURL('image/jpeg', q);
            if(out.length <= MAX_FILE_CHARS) break;
            q = Math.max(0.32, q - 0.12);
            w = Math.round(w * 0.8);
          }
          if(out.length > MAX_FILE_CHARS){ rej(new Error('사진 용량이 너무 큽니다. 다시 촬영해 등록해주세요')); return; }
          res(out);
        }catch(e){ rej(e); }
      };
      img.onerror = () => rej(new Error('이미지를 읽을 수 없습니다 (지원하지 않는 형식일 수 있습니다)'));
      img.src = ev.target.result;
    };
    rd.onerror = () => rej(new Error('파일을 읽을 수 없습니다'));
    rd.readAsDataURL(file);
  });
}
function readSmallFile(file, maxKB=650){ // PDF·엑셀 등 비이미지 (base64로 약 1.34배 커짐)
  return new Promise((res,rej)=>{
    if(file.size > maxKB*1024){
      rej(new Error(`파일이 너무 큽니다 (${Math.round(file.size/1024)}KB / 최대 ${maxKB}KB).\n엑셀은 이미지·불필요 시트를 지우거나, 견적서를 사진으로 촬영해 올려주세요.`));
      return;
    }
    const rd = new FileReader();
    rd.onload = ev => {
      const d = ev.target.result;
      if(String(d).length > MAX_FILE_CHARS){ rej(new Error('파일이 너무 큽니다. 용량을 줄여 다시 올려주세요')); return; }
      res(d);
    };
    rd.onerror = () => rej(new Error('파일을 읽을 수 없습니다'));
    rd.readAsDataURL(file);
  });
}

function deadline(r){ if(r.stage==='DONE'||r.stage==='DROPPED') return null; return r.stageAt + (state.cfg.sla[r.stage]||3)*DAY; }
function ddays(r){ const dl=deadline(r); if(dl===null) return null; return Math.ceil((dl-now())/DAY); }
function isOver(r){ const d=ddays(r); return d!==null && d<0; }
function ddayBadge(r){
  const d = ddays(r);
  if(d===null) return '';
  if(d<0) return `<span class="badge b-overdue">⚠ 기한초과 ${-d}일</span>`;
  if(d===0) return `<span class="badge b-amber">오늘 마감</span>`;
  return `<span class="dday" style="color:${d<=1?'var(--amber)':'var(--sub)'}">D-${d}</span>`;
}
function allNotis(){
  const over = visibleReqs().filter(isOver).map(r=>({
    ts:deadline(r), type:'over', reqId:r.id,
    text:`[${r.id}] ${STAGE_NM[r.stage]} 처리기한 ${-ddays(r)}일 초과 — ${STAGE_OWNER[r.stage]} 조치 필요 (${r.store})`
  }));
  const events = [];
  visibleReqs().forEach(r=>{ (r.history||[]).slice(-3).forEach(hh=>events.push({ts:hh.ts,type:'ev',reqId:r.id,text:`[${r.id}] ${hh.actor} — ${hh.action}`})); });
  events.sort((a,b)=>b.ts-a.ts);
  return [...over.sort((a,b)=>a.ts-b.ts), ...events.slice(0,25)];
}

/* ===== 미확인 채팅 =====
   방 문서의 누적 메시지 수(msgN)와 내가 마지막으로 본 지점(seenN)을 비교해 개수를 센다.
   msgN이 없는 예전 방은 시각으로만 판단해 개수 대신 '새 글'로 표시한다(-1). */
function roomMeta(name){ return (state.chatRooms||[]).find(r=>(r.name||r.id)===name); }
function unreadOf(name){
  const m = roomMeta(name);
  if(!m || !m.lastTs) return 0;
  const me = actorLabel();
  if(m.lastBy === me) return 0;                       // 내가 마지막으로 쓴 방
  if(typeof m.msgN === 'number'){
    /* msgN은 이 기능 배포 이후 쌓인 메시지 수. 한 번도 안 연 방은 seenN이 없으므로 0으로 본다 */
    const seenN = (state.seenN||{})[name] || 0;
    return Math.max(0, m.msgN - seenN);
  }
  return m.lastTs > (state.lastSeen[name]||0) ? -1 : 0;   // 배포 전 방 — 개수 미상
}
const hasUnread = name => unreadOf(name) !== 0;
/* 내가 볼 수 있는 방들의 미확인 합계 */
function unreadTotal(){
  if(!state.user || !canChat()) return 0;
  let n = 0;
  myRoomNames().forEach(name=>{ const u = unreadOf(name); n += u < 0 ? 1 : u; });
  return n;
}
function unreadRoomList(){
  return myRoomNames().filter(hasUnread)
    .map(name=>({name, n:unreadOf(name), meta:roomMeta(name)||{}}))
    .sort((a,b)=>(b.meta.lastTs||0)-(a.meta.lastTs||0));
}
function unreadRooms(){ return unreadRoomList().length; }
function unreadBadge(n){
  if(n === 0) return '';
  return n < 0 ? `<span class="ubadge">새 글</span>` : `<span class="ubadge">${n>99?'99+':n}</span>`;
}
/* 방을 열었을 때 읽음 처리 */
function markRead(room){
  const m = roomMeta(room);
  state.lastSeen[room] = now();
  if(m && typeof m.msgN === 'number'){ (state.seenN = state.seenN||{})[room] = m.msgN; }
  saveChatPrefs();
}
function renderNav(){
  if(!state.user) return;
  const un = canChat() ? unreadTotal() : 0;
  const chatLabel = '💬 채팅' + (un?` <span style="background:#FFD028;color:#7A2E00;border-radius:9px;font-size:10px;font-weight:800;padding:1px 6px;vertical-align:2px">${un}</span>`:'');
  const newPosts = role()==='hq' ? (state.posts||[]).filter(p=>p.status==='OPEN').length : 0;
  const bdLabel = '🛠 개선요청' + (newPosts?` <span style="background:#FFD028;color:#7A2E00;border-radius:9px;font-size:10px;font-weight:800;padding:1px 6px;vertical-align:2px">${newPosts}</span>`:'');
  let tabs, alias;
  if(isOrderApp(state.app)){
    tabs = [ ['odash','대시보드'], ['olist','발주 목록'] ];
    if(role()==='hq' || role()==='builder') tabs.push(['onew','+ 발주 등록']);
    if(role()==='hq' || role()==='builder' || role()==='supplier') tabs.push(['settle', role()==='supplier'?'정산·청구':'정산']);
    tabs.push(['board', bdLabel]);
    if(role()==='hq') tabs.push(['set','설정']);
    alias = { odetail:'olist', post:'board' };
  } else {
    tabs = [ ['dash','대시보드'], ['list','접수 목록'] ];
    if(canChat()) tabs.push(['chat',chatLabel]);
    if(role()==='store') tabs.push(['new','+ 신규 접수']);
    tabs.push(['board', bdLabel]);
    if(role()==='hq') tabs.push(['set','설정']);
    alias = { detail:'list', chatroom:'chat', post:'board' };
  }
  document.getElementById('nav').innerHTML = tabs.map(([v,t])=>
    `<button class="${(state.view===v || alias[state.view]===v)?'on':''}" onclick="go('${v}')">${t}</button>`).join('');

  renderChatBar();
  /* 시스템 전환 바 — 두 시스템을 모두 쓸 수 있는 역할에게만 */
  const sw = document.getElementById('appsw');
  const apps = myApps();
  if(apps.length>1){
    sw.style.display='flex';
    sw.innerHTML = apps.map(a=>`<button class="${state.app===a?'on':''}" onclick="switchApp('${a}')">${APP_ICON[a]} ${APP_NM[a]}</button>`).join('');
  } else sw.style.display='none';
}
/* 어느 화면에 있든 미확인 채팅을 상단에 띄운다 (채팅 화면에서는 숨김) */
function renderChatBar(){
  const bar = document.getElementById('chatbar');
  if(!bar) return;
  if(!state.user || !canChat() || isOrderApp(state.app)){ bar.style.display='none'; return; }
  const un = unreadRoomList();
  const inChat = state.view==='chat' || state.view==='chatroom';
  if(!un.length || inChat){ bar.style.display='none'; return; }
  const first = un[0];
  const more = un.length>1 ? ` 외 ${un.length-1}개 방` : '';
  bar.style.display='flex';
  bar.innerHTML = `<span class="cb-n">${unreadTotal()}</span>
    <span class="cb-t"><b>${esc(first.name)}</b> ${esc((first.meta.lastBy?first.meta.lastBy+': ':'')+(first.meta.lastMsg||''))}${more}</span>
    <span class="cb-go">보기 ›</span>`;
}
function goUnreadChat(){
  const un = unreadRoomList();
  if(!un.length){ go('chat'); return; }
  if(un.length===1) openRoom(un[0].name);
  else go('chat');
}
function switchApp(a){
  if(!canApp(a) || state.app===a) return;
  state.app = a;
  stopDetailFiles();
  state.view = isOrderApp(a) ? 'odash' : 'dash';
  state.detailId=null; state.orderId=null;
  render(); window.scrollTo(0,0);
}
const DEPTS = ['인테리어팀','산업안전팀','잘모르겠음'];
function deptBadge(d){

/* 알림 권한을 아직 안 물어본 사용자에게 한 번 안내 (닫으면 다시 안 뜸) */
function notiPrompt(){
  if(typeof Notification==='undefined') return '';
  if(Notification.permission!=='default') return '';
  try{ if(localStorage.getItem('bosuon_notiask')==='1') return ''; }catch(e){}
  return `<div class="card" id="notiAsk" style="display:flex;align-items:center;gap:10px;border-left:4px solid var(--red)">
    <span style="flex:1;font-size:13px;font-weight:700">🔔 알림을 켜면 단계 변경·견적·채팅이 도착할 때 바로 알려드립니다.
      <div style="font-size:11.5px;color:var(--sub);font-weight:500;margin-top:2px">휴대폰은 「홈 화면에 추가」 후 켜주세요</div></span>
    <button class="btn sm" onclick="askNoti()">켜기</button>
    <button class="btn sec2 sm" onclick="dismissNotiAsk()">나중에</button>
  </div>`;
}
async function askNoti(){
  dismissNotiAsk(true);
  if(!await ensureNotiPerm()) { render(); return; }
  state.reqNoti = true; state.chatNoti = true; saveChatPrefs();
  showNotif('GRS 보수ON', '알림이 켜졌습니다!', 'welcome', null);
  toast('알림을 켰습니다'); render();
}
function dismissNotiAsk(silent){
  try{ localStorage.setItem('bosuon_notiask','1'); }catch(e){}
  const el = document.getElementById('notiAsk'); if(el) el.remove();
  if(!silent) toast('알림 패널(🔔)에서 언제든 켤 수 있습니다');
}

/* ===== 대시보드 ===== */
function vDash(){
  const rs = visibleReqs();
  const open = rs.filter(r=>r.stage!=='DONE'&&r.stage!=='DROPPED');
  const over = rs.filter(isOver);
  const done = rs.filter(r=>r.stage==='DONE');
  const cnt = s => rs.filter(r=>r.stage===s).length;
  const barStages = [...STAGES,'DROPPED'];
  const max = Math.max(...barStages.map(cnt),1);
  const bars = barStages.map(s=>`
    <button class="stagebar" style="width:100%" onclick="goList('${s}')"><span class="nm">${STAGE_NM[s]} ›</span>
      <div class="tr"><div class="fl" style="width:${cnt(s)/max*100}%;${s==='DONE'?'background:var(--green)':s==='DROPPED'?'background:#9CA3AF':''}"></div></div>
      <span class="v">${cnt(s)}</span></button>`).join('');
  const overList = over.length ? over.map(reqCard).join('') : '<div class="card" style="color:var(--sub);font-weight:700;text-align:center">기한초과 건이 없습니다 👍</div>';
  const installBanner = window.deferredPrompt ? `<button class="card" style="width:100%;text-align:left;display:flex;align-items:center;gap:10px;border:2px solid var(--red)" onclick="installApp()"><span style="font-size:24px">📲</span><span><b>앱으로 설치하기</b><div style="font-size:12.5px;color:var(--sub)">홈 화면에 설치하면 앱처럼 바로 실행됩니다</div></span></button>` : '';
  return roleNote()+installBanner+`
    <div class="tiles">
      <button class="tile" onclick="goList('ALL')"><div class="n">${rs.length}</div><div class="t">전체 접수 ›</div></button>
      <button class="tile" onclick="goList('OPEN')"><div class="n">${open.length}</div><div class="t">진행중 ›</div></button>
      <button class="tile alert" onclick="goList('OVER')"><div class="n">${over.length}</div><div class="t">기한 초과 ›</div></button>
      <button class="tile" onclick="goList('DONE')"><div class="n" style="color:var(--green)">${done.length}</div><div class="t">완료 ›</div></button>
      <button class="tile" onclick="goList('OPENREQ')"><div class="n" style="color:#6B34B8">${rs.filter(r=>r.kind==='open').length}</div><div class="t">🏗 오픈 직후 ›</div></button>
    </div>
    <div class="card"><div class="h2">단계별 현황 <span style="font-size:10.5px;color:var(--sub);font-weight:600">터치하면 해당 목록으로 이동</span></div>${bars}</div>
    ${role()==='hq'?VENDORS.map(v=>partnerCard(rs.filter(r=>reqVendor(r)===v), v)).join(''):''}
    <div class="h2" style="margin:16px 2px 10px">⚠️ 기한초과 — 조치 필요 <span class="badge b-red">${over.length}건</span></div>
    ${overList}`;
}

/* ===== 파트너사 평가 현황 (본사) ===== */
function partnerCard(rs, coName){
  const done = rs.filter(r=>r.stage==='DONE');
  const rated = done.filter(r=>r.rating);
  const avgRate = rated.length ? (rated.reduce((a,b)=>a+b.rating,0)/rated.length) : null;
  const rejects = rs.reduce((a,b)=>a+(b.rejectCount||0),0);
  const odEvents = rs.flatMap(r=>r.overdues||[]);
  const odDays = odEvents.reduce((a,b)=>a+(b.days||0),0);
  const dropped = rs.filter(r=>r.stage==='DROPPED');
  const durs = done.filter(r=>r.completedAt).map(r=>(r.completedAt-r.createdAt)/DAY);
  const avgDur = durs.length ? Math.round(durs.reduce((a,b)=>a+b,0)/durs.length) : null;
  const nowOver = rs.filter(isOver).length;
  const rateColor = avgRate===null?'var(--sub)':avgRate<=4?'var(--red-dark)':avgRate<=7?'var(--amber)':'var(--green)';
  const lowRates = rated.filter(r=>r.rating<=4);
  return `<div class="card">
    <div class="h2">🏆 파트너사 평가 현황 <span class="badge ${coName==='우리아이엔티'?'b-blue':'b-gray'}">${coName}</span></div>
    ${rs.length===0?'<div class="note">해당 업체 담당 접수 건이 아직 없습니다.</div>':''}
    <div class="kv"><b>완료 실적</b>${done.length}건${avgDur!==null?` · 평균 처리 ${avgDur}일`:''}</div>
    <div class="kv"><b>점포 만족도</b><strong style="color:${rateColor}">${avgRate!==null?'★ '+avgRate.toFixed(1)+' / 10':'평가 없음'}</strong>${rated.length?`&nbsp;(${rated.length}건 평가)`:''}</div>
    <div class="kv"><b>견적 반려</b>${rejects?`<span style="color:var(--red-dark);font-weight:700">누적 ${rejects}회</span>`:'0회'}</div>
    <div class="kv"><b>기한초과 이력</b>${odEvents.length?`<span style="color:var(--red-dark);font-weight:700">${odEvents.length}회 · 누적 지연 ${odDays}일</span>`:'없음'}${nowOver?` · 현재 초과 ${nowOver}건`:''}</div>
    <div class="kv"><b>중단 건</b>${dropped.length}건</div>
    ${lowRates.length?`<div class="note warn" style="margin-top:6px">⚠ 저만족(4점 이하) ${lowRates.length}건 — ${lowRates.slice(0,3).map(r=>`[${r.id}] ${esc(r.ratingReason||'사유 미기재')}`).join(' / ')}</div>`:''}
    <div class="note" style="margin-top:8px">기한초과·반려·만족도는 처리 과정에서 자동 축적되며, 엑셀 내보내기에 포함됩니다.</div>
  </div>`;
}

/* ===== 목록 ===== */
function reqCard(r){
  const idx = STAGES.indexOf(r.stage);
  const bar = STAGES.slice(0,5).map((s,i)=>`<i class="${i<idx?'done':(i===idx&&r.stage!=='DONE'?'cur':(r.stage==='DONE'?'done':''))}"></i>`).join('');
  return `<button class="card req" onclick="go('detail','${r.id}')">
    <div class="row1">
      <span class="id">${r.id}</span>
      <span class="badge ${STAGE_BADGE[r.stage]}">${waitLabel(r)}</span>
      ${r.urgency==='긴급'?'<span class="badge urgent">긴급</span>':''}
      ${r.kind==='open'?'<span class="badge b-purple">🏗 오픈 직후</span>':''}
      ${r.dept&&r.dept!=='잘모르겠음'?deptBadge(r.dept):''}
      ${isOver(r)?`<span class="badge b-overdue">기한초과</span>`:''}
    </div>
    <h3>${esc(r.title)}</h3>
    <div class="meta">${esc(r.store)} · 접수 ${fmtD(r.createdAt)}</div>
    <div class="row2"><div class="minibar">${bar}</div>${r.stage==='DONE'?'<span class="badge b-green">완료</span>':ddayBadge(r)}</div>
  </button>`;
}
function reqCardsHtml(){
  let rs = visibleReqs().slice().sort((a,b)=>{
    const ao=isOver(a)?0:1, bo=isOver(b)?0:1;
    if(ao!==bo) return ao-bo;
    return b.createdAt-a.createdAt;
  });
  if(state.filter==='OVER') rs = rs.filter(isOver);
  else if(state.filter==='OPEN') rs = rs.filter(r=>r.stage!=='DONE'&&r.stage!=='DROPPED');
  else if(state.filter==='OPENREQ') rs = rs.filter(r=>r.kind==='open');
  else if(state.filter==='MINE') rs = rs.filter(r=>r.store===state.user.store);
  else if(state.filter!=='ALL') rs = rs.filter(r=>r.stage===state.filter);
  if(state.q) rs = rs.filter(r=>(r.title+r.store+r.id+(r.desc||'')+(r.dept||'')).toLowerCase().includes(String(state.q).toLowerCase()));
  return rs.length? rs.map(reqCard).join('') : '<div class="empty">조건에 맞는 접수 건이 없습니다</div>';
}
function vList(){
  const chips = [['ALL','전체'],['OPEN','진행중'],['OPENREQ','🏗 오픈 직후'],['MINE','내 점포'],['OVER','⚠ 기한초과'],...STAGES.map(s=>[s,STAGE_NM[s]]),['DROPPED','⛔ 중단']];
  const useChips = role()==='store' ? chips : chips.filter(c=>c[0]!=='MINE');
  return roleNote()+`
    <div class="search"><input id="listSq" placeholder="🔍 점포명·공사내용·접수번호 검색" value="${esc(state.q)}" oninput="state.q=this.value;const el=document.getElementById('reqList');if(el)el.innerHTML=reqCardsHtml()"></div>
    <div class="filters">${useChips.map(([k,t])=>`<button class="chip ${state.filter===k?'on':''}" onclick="state.filter='${k}';render()">${t}</button>`).join('')}</div>
    ${role()==='hq'?`<button class="btn sec2 sm" style="margin-bottom:10px" onclick="exportCSV()">⬇ 엑셀(CSV) 내보내기</button>`:''}
    <div id="reqList">${reqCardsHtml()}</div>`;
}

/* ===== 상세 ===== */
function stepper(r){
  const idx = STAGES.indexOf(r.stage);
  return `<div class="stepper">${STAGES.map((s,i)=>{
    const cls = i<idx||r.stage==='DONE' ? 'done' : (i===idx?'cur':'');
    return `<div class="step ${cls}"><div class="dot">${(i<idx||r.stage==='DONE')?'✓':i+1}</div>${STAGE_NM[s]}</div>`;
  }).join('')}</div>`;
}
function photosHtml(id, kind){
  const all = filesCache[id]||[];
  const out = [];
  all.forEach((f,i)=>{ if(f.kind===kind && f.data) out.push(`<img src="${f.data}" loading="lazy" onclick="viewImg(${i},'${id}')" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'imgfail',textContent:'⚠ 이미지 오류'}))">`); });
  if(!out.length) return '';
  return `<div class="photos">${out.join('')}</div>`;
}
/* 사진이 아직 안 보이는 상태를 정확히 구분해서 알려준다 (무한 "불러오는 중" 방지) */
function photoPlaceholder(r, kind, expected){
  const id = r.id;
  if(filesErr[id]){
    const ec = String(filesErr[id]);
    let hint = ec;
    if(ec.includes('permission-denied')) hint = '접근 권한 없음 — Firestore 보안 규칙에서 requests 하위 files 컬렉션 읽기를 허용해야 합니다';
    else if(ec.includes('unavailable')||ec.includes('network')) hint = '네트워크 오류 — 연결 확인 후 다시 시도해주세요';
    return `<div class="note warn">⚠ 첨부파일을 불러오지 못했습니다<div style="font-size:11.5px;margin-top:3px">${esc(hint)}</div>
      <button class="btn sec2 sm" style="margin-top:8px" onclick="retryFiles('${id}')">🔄 다시 불러오기</button></div>`;
  }
  if(!filesLoaded[id]) return `<div class="note"><span class="spin dk"></span> 사진 불러오는 중…</div>`;
  if(expected) return `<div class="note">접수 시 사진 ${expected}장이 등록되었으나 파일을 찾을 수 없습니다.
    <button class="btn sec2 sm" style="margin-top:8px" onclick="retryFiles('${id}')">🔄 다시 불러오기</button></div>`;
  return '';
}
/* 첨부파일 다운로드 — data URL은 브라우저에 따라 저장이 막히므로 Blob으로 변환해 내려받는다 */
function dataUrlToBlob(d){
  const s = String(d||'');
  const i = s.indexOf(',');
  if(i < 0) throw new Error('잘못된 파일 형식');
  const head = s.slice(0,i), body = s.slice(i+1);
  const mime = (head.match(/data:([^;,]+)/)||[])[1] || 'application/octet-stream';
  if(/;base64/i.test(head)){
    const bin = atob(body);
    const u8 = new Uint8Array(bin.length);
    for(let k=0;k<bin.length;k++) u8[k] = bin.charCodeAt(k);
    return new Blob([u8], {type:mime});
  }
  /* base64가 아닌 data URL (예: SVG) */
  return new Blob([decodeURIComponent(body)], {type:mime});
}
function fileAt(reqId, i){ return (filesCache[reqId]||[])[i]; }
const MIME_EXT = {'image/jpeg':'jpg','image/png':'png','image/webp':'webp','image/svg+xml':'svg','application/pdf':'pdf',
  'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet':'xlsx','application/vnd.ms-excel':'xls'};
/* 저장될 파일명 — 확장자가 없으면 실제 형식에서 유추한다 */
function dlName(reqId, f){
  let n = (f.name||'').trim();
  if(/\.[a-z0-9]{2,5}$/i.test(n)) return n;
  const mime = (String(f.data||'').match(/data:([^;,]+)/)||[])[1] || '';
  const ext = MIME_EXT[mime] || 'dat';
  const base = n || `${reqId}_${f.kind||'file'}`;
  return `${base}.${ext}`;
}
function dlFile(reqId, i){
  const f = fileAt(reqId, i);
  if(!f || !f.data){ toast('파일을 찾을 수 없습니다. 「다시 불러오기」를 눌러주세요'); return; }
  try{
    const url = URL.createObjectURL(dataUrlToBlob(f.data));
    const a = document.createElement('a');
    a.href = url; a.download = dlName(reqId, f);
    a.style.display='none'; document.body.appendChild(a); a.click();
    setTimeout(()=>{ try{URL.revokeObjectURL(url); a.remove();}catch(e){} }, 8000);
    toast('다운로드를 시작했습니다');
  }catch(e){ openFile(reqId, i); }
}
function openFile(reqId, i){
  const f = fileAt(reqId, i);
  if(!f || !f.data){ toast('파일을 찾을 수 없습니다'); return; }
  try{
    const url = URL.createObjectURL(dataUrlToBlob(f.data));
    window.open(url, '_blank');
    setTimeout(()=>{ try{URL.revokeObjectURL(url);}catch(e){} }, 30000);
  }catch(e){ toast('파일을 열 수 없습니다'); }
}
const FILE_ICON = n => /\.xlsx?$/i.test(n||'') ? '📊' : /\.pdf$/i.test(n||'') ? '📕' : /\.(png|jpe?g|webp|heic)$/i.test(n||'') ? '🖼' : '📎';

/* 첨부파일을 지울 수 있는 사람 — 본사담당, 또는 올린 본인 */
function canDelFile(reqId, f){
  if(role()==='hq') return true;
  const me = actorLabel();
  if(f.by && f.by===me) return true;
  const isOrder = String(reqId).startsWith('O:');
  if(isOrder){
    const o = O(String(reqId).slice(2));
    if(!o) return false;
    if(role()==='supplier' && o.supplier===myCo()) return ['quote'].includes(f.kind);
    if(role()==='builder'  && o.builder===myCo())  return ['delivery'].includes(f.kind);
    return false;
  }
  const r = R(reqId);
  if(!r) return false;
  if(role()==='store'  && r.store===state.user.store) return ['photo'].includes(f.kind);
  if(role()==='vendor' && reqVendor(r)===myCo())      return ['survey','estimate','estimate-file','done'].includes(f.kind);
  return false;
}
function fileListHtml(reqId, kinds, label){
  const all = filesCache[reqId]||[];
  const rows = [];
  all.forEach((f,i)=>{
    if(!kinds.includes(f.kind)) return;
    const kb = f.data ? Math.max(1, Math.round(f.data.length*0.75/1024)) : 0;
    rows.push(`<div class="filerow">
      <span class="fname">${FILE_ICON(f.name)} ${esc(f.name||'첨부파일')}<span class="fmeta">${kb}KB · ${fmtDT(f.ts)}${f.by?' · '+esc(f.by):''}</span></span>
      <span class="facts">
        <button class="btn sec2 sm" onclick="openFile('${reqId}',${i})">열기</button>
        <button class="btn sm dl" onclick="dlFile('${reqId}',${i})">⬇ 다운로드</button>
        ${canDelFile(reqId,f)?`<button class="btn sm delx" onclick="delFile('${reqId}',${i})">🗑</button>`:''}
      </span></div>`);
  });
  if(!rows.length) return '';
  return `<div class="filebox"><div class="filehd">${label}</div>${rows.join('')}</div>`;
}
/* 첨부파일 삭제 */
async function delFile(reqId, i){
  const f = fileAt(reqId, i);
  if(!f){ toast('파일을 찾을 수 없습니다'); return; }
  if(!canDelFile(reqId, f)){ toast('삭제 권한이 없습니다'); return; }
  if(!confirm(`「${f.name||'첨부파일'}」을(를) 삭제할까요?\n삭제하면 되돌릴 수 없습니다.`)) return;
  try{
    await store.deleteFile(reqId, f);
    /* 사진 장수 보정 */
    const isOrder = String(reqId).startsWith('O:');
    if(isOrder){
      const o = O(String(reqId).slice(2));
      if(o && f.kind==='delivery' && o.receipt){
        const n = (filesCache[reqId]||[]).filter(x=>x.kind==='delivery').length;
        try{ await store.updateOrder(o.id, {receipt:Object.assign({}, o.receipt, {photoCount:n})}, oEntry(`납품 사진 1장 삭제 (${esc(f.name||'')})`)); }catch(e){}
      } else if(o && f.kind==='drawing'){
        const n = (filesCache[reqId]||[]).filter(x=>x.kind==='drawing').length;
        try{ await store.updateOrder(o.id, {drawingCount:n}, oEntry(`도면 1매 삭제`)); }catch(e){}
      }
    } else {
      const r = R(reqId);
      if(r && f.kind==='photo'){
        const n = (filesCache[reqId]||[]).filter(x=>x.kind==='photo').length;
        try{ await store.updateRequest(reqId, {photoCount:n}, {ts:now(),actor:actorLabel(),action:'접수 사진 1장 삭제'}); }catch(e){}
      }
    }
    toast('삭제되었습니다');
    if(!modalOpen()) render();
  }catch(e){ toast('삭제 실패: '+(e.code||e.message)); }
}

/* ===== 신규 접수 (점포) =====
   작성 중 내용은 임시저장한다.
   ① 백그라운드 실시간 갱신으로 render()가 돌아도 폼이 초기화되지 않도록
   ② 휴대폰에서 카메라·사진첩을 열었다 돌아오며 페이지가 재시작돼도 살아남도록 */
const EMPTY_DRAFT = { store:'', title:'', desc:'', urg:'보통', dept:'잘모르겠음', photos:[],
                      kind:'fix', openDate:'', openType:'공사 보완', builder:'' };
let newDraft = {...EMPTY_DRAFT, photos:[]};
let draftPhotoWarn = false;

function saveDraft(){
  try{
    localStorage.setItem('bosuon_draft', JSON.stringify(newDraft));
    draftPhotoWarn = false;
  }catch(e){
    /* 사진까지 담기엔 저장공간이 부족한 경우 — 글은 반드시 지킨다 */
    try{
      localStorage.setItem('bosuon_draft', JSON.stringify({...newDraft, photos:[]}));
      draftPhotoWarn = true;
    }catch(e2){}
  }
}
function loadDraft(){
  try{
    const d = JSON.parse(localStorage.getItem('bosuon_draft')||'null');
    if(d && typeof d==='object') newDraft = {...EMPTY_DRAFT, ...d, photos:Array.isArray(d.photos)?d.photos:[]};
  }catch(e){}
}
function clearDraft(){
  newDraft = {...EMPTY_DRAFT, photos:[]};
  draftPhotoWarn = false;
  try{ localStorage.removeItem('bosuon_draft'); }catch(e){}
}
function hasDraft(){
  return !!(newDraft.title || newDraft.desc || (newDraft.photos||[]).length);
}
/* 입력할 때마다 화면 값을 임시저장에 반영 */
function updDraft(){
  const g = id => { const el=document.getElementById(id); return el ? el.value : null; };
  const before = hasDraft();
  const v = {store:g('nStore'), title:g('nTitle'), desc:g('nDesc'), urg:g('nUrg'), dept:g('nDept'),
             openDate:g('nOpenDate'), openType:g('nOpenType'), builder:g('nBuilder')};
  Object.keys(v).forEach(k=>{ if(v[k]!==null) newDraft[k]=v[k]; });
  saveDraft();
  if(hasDraft() !== before) refreshDraftUI();   // 임시저장 안내·초기화 버튼 표시 전환
}
function resetNew(){
  if(hasDraft() && !confirm('작성 중인 내용과 사진을 모두 지울까요?')) return;
  clearDraft();
  const m = document.getElementById('main');
  if(m) m.innerHTML = vNew();

}

function setReqKind(k){
  updDraft();
  newDraft.kind = k;
  if(k==='open' && !newDraft.openDate) newDraft.openDate = tsToDateInput(now()-7*DAY);
  saveDraft();
  document.getElementById('main').innerHTML = vNew();
  openDayHint();
}
/* 오픈 후 며칠 지났는지 자동 계산해 보여준다 */
function openDayHint(){
  const el = document.getElementById('nOpenHint');
  const inp = document.getElementById('nOpenDate');
  if(!el || !inp) return;
  if(!inp.value){ el.style.display='none'; return; }
  const days = Math.floor((now() - new Date(inp.value+'T12:00:00').getTime())/DAY);
  el.style.display='block';
  el.innerHTML = days < 0 ? '오픈 예정일입니다.'
    : days <= 30 ? `오픈 후 <b>${days}일</b> 경과 — 오픈 하자·보완 대상 기간(30일 이내)입니다.`
    : `오픈 후 <b>${days}일</b> 경과 — 30일이 지나 일반 보수로 처리될 수 있습니다.`;
}
function draftPhotosHtml(){
  return (newDraft.photos||[]).map((p,i)=>
    `<span style="position:relative;display:inline-block">
       <img src="${p}">
       <button onclick="delDraftPhoto(${i})" title="삭제"
         style="position:absolute;top:-5px;right:-5px;width:22px;height:22px;border-radius:50%;background:var(--red);color:#fff;font-size:13px;font-weight:800;line-height:1;box-shadow:0 1px 4px rgba(0,0,0,.3)">×</button>
     </span>`).join('');
}
function draftNoteHtml(){
  if(draftPhotoWarn && (newDraft.photos||[]).length)
    return `<div class="note warn">⚠ 사진이 많아 임시저장에는 글만 보관됩니다. 앱을 껐다 켜면 사진은 다시 첨부해주세요.</div>`;
  if(hasDraft()) return `<div class="note">💾 작성 중인 내용은 자동 임시저장됩니다. 앱을 껐다 켜도 이어서 작성할 수 있습니다.</div>`;
  return '';
}
function resetBtnHtml(){
  return hasDraft() ? `<button class="btn sec2 blk" onclick="resetNew()">🗑 작성 내용 지우고 새로 쓰기</button>` : '';
}
function refreshDraftUI(){
  const pv = document.getElementById('nPrev');      if(pv) pv.innerHTML = draftPhotosHtml();
  const nt = document.getElementById('nDraftNote'); if(nt) nt.innerHTML = draftNoteHtml();
  const rw = document.getElementById('nResetWrap'); if(rw) rw.innerHTML = resetBtnHtml();
}
function delDraftPhoto(i){
  (newDraft.photos||[]).splice(i,1);
  saveDraft(); refreshDraftUI();
}
async function pickPhotos(inp){
  updDraft();                       // 사진 처리 전에 현재 입력값부터 확보
  const files = [...inp.files];
  if(!files.length) return;
  if(!newDraft.photos) newDraft.photos = [];
  toast(`사진 ${files.length}장 처리 중…`);
  for(const f of files){
    try{ newDraft.photos.push(await compressImage(f)); }
    catch(e){ toast('사진 처리 실패: '+f.name); }
  }
  inp.value = '';                   // 같은 사진을 다시 고를 수 있도록 초기화
  saveDraft();
  refreshDraftUI();
  toast(`사진 ${newDraft.photos.length}장 첨부됨`);
}
async function submitNew(){
  updDraft();
  const title = (newDraft.title||'').trim();
  const desc = (newDraft.desc||'').trim();
  const storeNm = (newDraft.store||'').trim();
  if(!storeNm){ toast('점포명을 입력해주세요'); return; }
  if(!title){ toast('공사 제목을 입력해주세요'); return; }
  const photos = (newDraft.photos||[]).slice();
  const btn = document.getElementById('nSubmit'); btn.disabled=true; btn.innerHTML='<span class="spin"></span> 접수 중…';
  const d = new Date();
  const id = `R-${String(d.getFullYear()).slice(2)}${String(d.getMonth()+1).padStart(2,'0')}-${rnd4()}`;
  const isOpen = newDraft.kind==='open';
  const openTs = isOpen && newDraft.openDate ? new Date(newDraft.openDate+'T12:00:00').getTime() : null;
  const elapsed = openTs!=null ? Math.floor((now()-openTs)/DAY) : null;
  const r = { id, store:storeNm, title, desc, urgency:newDraft.urg||'보통', dept:newDraft.dept||'잘모르겠음', vendorCo:storeVendor(storeNm),
    kind: isOpen?'open':'fix',
    createdAt:now(), stage:'SURVEY', stageAt:now(), estimates:[], comments:[], photoCount:photos.length,
    history:[{ts:now(),actor:actorLabel(),
      action: isOpen ? `오픈 직후 추가요청 접수${elapsed!=null?` (오픈 후 ${elapsed}일)`:''}${photos.length?` · 사진 ${photos.length}장`:''}`
                     : `보수공사 접수 (사진 ${photos.length}장)`}] };
  if(isOpen){
    if(openTs!=null) r.openDate = openTs;
    r.openType = newDraft.openType || '공사 보완';
    if(newDraft.builder) r.builder = newDraft.builder;
  }
  try{
    await store.saveRequest(r);
    /* 사진은 1장씩 따로 저장 — 한 장이 실패해도 접수 자체는 살리고, 실제 저장된 장수를 기록한다 */
    let saved = 0, failed = 0;
    for(let i=0;i<photos.length;i++){
      try{ await store.addFile(id,{kind:'photo',name:`photo_${i+1}.jpg`,data:photos[i],ts:now(),by:actorLabel()}); saved++; }
      catch(fe){ failed++; console.warn('photo save', fe); }
    }
    if(saved !== photos.length){
      try{ await store.updateRequest(id, {photoCount:saved}); }catch(e){}
    }
    toast(failed ? `접수 완료 — 사진 ${saved}/${photos.length}장 저장 (${failed}장 실패)` : '접수가 완료되었습니다');
    clearDraft();                   // 접수에 성공했을 때만 임시저장을 비운다
    go('detail', id);
  }catch(e){ toast('저장 실패: '+(e.code||e.message)); btn.disabled=false; btn.textContent='접수하기'; }
}

let mFileData=null, mFileName=null, mFileIsImg=false, mXlsxRows=null;
function mEstimate(id){
  mFileData=null; mFileName=null; mXlsxRows=null;
  setTimeout(()=>{ const r=R(id); const el=document.getElementById('mDept'); if(el&&r&&r.dept) el.value=r.dept; }, 50);

    <div class="note">조명·타일 발주와 <b>동일한 표준 견적서 양식</b>입니다. 이 양식으로 올리면 항목·금액이 자동 검토됩니다.</div>
    <button class="btn sec2 blk" style="margin-top:8px" onclick="downloadQuoteForm('bosu',{site:'${esc((rq&&rq.store)||'').replace(/'/g,"\\'")}',co:'${esc(myCo())}'})">⬇ 표준 견적서 양식(.xlsx) 내려받기</button>
    <label>견적 금액 (원)</label><input id="mAmt" type="number" inputmode="numeric" placeholder="예) 1500000">
    <label>견적일</label><input id="mEstDate" type="date" value="${tsToDateInput(now())}">
    <label>작업 예정일시 (공사 가능 일정)</label><input id="mWork" type="datetime-local">
    <label>담당부서 확인 (현장 판단 기준)</label>
    <select id="mDept"><option>잘모르겠음</option><option>인테리어팀</option><option>산업안전팀</option></select>
    <label>견적서 파일 (엑셀 업로드 시 자동 검토 · 사진/PDF 가능)</label>
    <input type="file" id="mF" accept="image/*,.pdf,.xlsx" style="display:none" onchange="pickEstFile(this)">
    <button class="file-add" onclick="document.getElementById('mF').click()"><span id="mFn">📎 파일 선택</span></button>
    <button class="btn blk" onclick="doEstimate('${id}')">업로드</button>`);
}
async function pickEstFile(inp){
  const f = inp.files[0]; if(!f) return;
  try{
    mXlsxRows = null;
    if(/\.xlsx$/i.test(f.name)){
      const buf = await f.arrayBuffer();
      mXlsxRows = await parseXlsx(buf);
      const quick = analyzeEstimate(mXlsxRows, null);
      document.getElementById('mFn').textContent = quick.ok
        ? `📊 ${f.name} — ${quick.itemCount}개 항목, 합계 ${money(quick.sheetTotal??quick.calcTotal)} 인식됨`
        : `📊 ${f.name} — 표 인식 실패(업로드는 가능)`;
      if(quick.ok && !document.getElementById('mAmt').value)
        document.getElementById('mAmt').value = quick.sheetTotal??quick.calcTotal;
      mFileIsImg = false;
      try{ mFileData = await readSmallFile(f); }
      catch(err){
        mFileData = null;
        document.getElementById('mFn').textContent = `⚠ ${f.name} — 용량 초과로 파일은 첨부되지 않습니다 (금액·분석만 반영)`;
        toast(err.message);
      }
    }
    else if(f.type.startsWith('image/')){ mFileData = await compressImage(f,1400,0.72); mFileIsImg=true; document.getElementById('mFn').textContent='📎 '+f.name; }
    else { mFileData = await readSmallFile(f); mFileIsImg=false; document.getElementById('mFn').textContent='📎 '+f.name; }
    mFileName = f.name;
  }catch(e){ mFileData=null; toast(e.message||'파일 처리 실패'); }
}
async function doEstimate(id){
  const amt = Number(document.getElementById('mAmt').value);
  if(!amt){ toast('견적 금액을 입력해주세요'); return; }
  const est = {ts:now(), amount:amt, fileName:mFileName||'(파일 없음)', status:'검토대기'};
  const ed = document.getElementById('mEstDate').value;
  if(ed) est.estDate = new Date(ed+'T12:00:00').getTime();
  const wp = document.getElementById('mWork').value;
  if(wp) est.workPlan = new Date(wp).getTime();
  const dsel = document.getElementById('mDept');
  if(dsel && dsel.value) est.dept = dsel.value;
  if(mXlsxRows){ try{ est.analysis = analyzeEstimate(mXlsxRows, amt); }catch(e){} }
  const r = R(id);
  const deptPatch = {};
  if(est.dept && est.dept!=='잘모르겠음'){
    deptPatch.deptVendor = est.dept;
    if(!r.dept || r.dept==='잘모르겠음') deptPatch.dept = est.dept;
  }
  try{
    await store.updateRequest(id, {estimates:[...(r.estimates||[]), est], stage:'REVIEW', stageAt:now(), ...deptPatch},
      {ts:now(),actor:actorLabel(),action:`견적서 업로드 (${money(amt)}${est.workPlan?`, 작업예정 ${fmtDT(est.workPlan)}`:''})`});
    if(mFileData){
      try{
        await store.addFile(id,{kind:mFileIsImg?'estimate':'estimate-file',name:mFileName||'견적서',data:mFileData,ts:now()});
      }catch(fe){
        closeModal();
        toast('견적 금액은 등록됐지만 파일 첨부에 실패했습니다: '+(fe.code||fe.message));
        return;
      }
    } else if(mFileName){
      closeModal();
      toast('견적 금액은 등록됐습니다 (파일은 첨부되지 않음 — 용량 초과)');
      return;
    }
    closeModal(); toast('견적서가 업로드되었습니다');
  }catch(e){ toast('저장 실패: '+(e.code||e.message)); }
}
function mReview(id){

/* 내가 참여하는 방 이름 목록 (검색어 무시) */
function myRoomNames(){
  if(!state.user || !canChat()) return [];
  if(role()==='store') return ['전체', state.user.store || state.user.name];
  const known = new Set(['전체', ...state.cfg.stores]);
  (state.chatRooms||[]).forEach(r=>known.add(r.name||r.id));
  let names = ['전체', ...[...known].filter(n=>n!=='전체')];
  if(role()==='vendor') names = names.filter(n=>n==='전체' || storeVendor(n)===myCo());
  return names;
}
function myRooms(){
  const metaMap = {};
  state.chatRooms.forEach(r=>metaMap[r.name||r.id]=r);
  let names;
  if(role()==='store') names = ['전체', state.user.store || state.user.name];
  else {
    const known = new Set(['전체', ...state.cfg.stores]);
    state.chatRooms.forEach(r=>known.add(r.name||r.id));
    names = ['전체', ...[...known].filter(n=>n!=='전체')];
  }
  let rooms = names.map(n=>({name:n, ...(metaMap[n]||{})}));
  if(role()==='vendor') rooms = rooms.filter(r=>r.name==='전체' || storeVendor(r.name)===myCo());
  if(state.roomQ) rooms = rooms.filter(r=>r.name.toLowerCase().includes(state.roomQ.toLowerCase()));
  /* ① 미확인 방 먼저 (그 안에서는 최근 도착 순)
     ② 그다음 전체방(공지) 고정
     ③ 나머지는 최근 순 */
  return rooms.sort((a,b)=>{
    const ua = hasUnread(a.name)?0:1, ub = hasUnread(b.name)?0:1;
    if(ua!==ub) return ua-ub;
    if(ua===0) return (b.lastTs||0)-(a.lastTs||0);   // 미확인끼리는 최근 순
    if(a.name==='전체') return -1; if(b.name==='전체') return 1;
    return (b.lastTs||0)-(a.lastTs||0);
  });
}
function roomsHtml(){
  const rooms = myRooms();
  return rooms.map(r=>{
    const u = unreadOf(r.name);
    return `<button class="card roomrow${u?' unread':''}" onclick="openRoom('${esc(r.name).replace(/'/g,"\\'")}')">
      <span style="font-size:22px">${r.name==='전체'?'📢':'🏪'}</span>
      <span class="rmain"><span class="rname">${esc(r.name)}${r.name==='전체'?' (공지·전체방)':''}</span>
      <div class="rlast">${r.lastBy?esc(r.lastBy)+': ':''}${esc(r.lastMsg||'대화를 시작해보세요')}</div></span>
      <span class="rright">${unreadBadge(u)}<span class="rts">${r.lastTs?fmtD(r.lastTs):''}</span></span>
    </button>`;
  }).join('') || '<div class="empty">채팅방이 없습니다</div>';
}
function vChat(){
  const search = role()==='store' ? '' :
    `<div class="search"><input id="roomSq" placeholder="🔍 점포 채팅방 검색" value="${esc(state.roomQ)}" oninput="state.roomQ=this.value;const el=document.getElementById('roomList');if(el)el.innerHTML=roomsHtml()"></div>`;

  return roleNote()+`

}

function maybeNotify(room, meta){
  if(!state.chatNoti) return;
  if(state.view==='chatroom' && state.chatRoom===room && !document.hidden) return; // 그 방을 보고 있으면 생략
  showNotif(`💬 ${room}`, `${meta.lastBy}: ${meta.lastMsg||''}`.slice(0,90), 'chat-'+room, null, room);
  renderNav();
}
async function showNotif(title, body, tag, reqId, room){
  try{
    if(typeof Notification==='undefined' || Notification.permission!=='granted') return;
    const opts = {
      body, tag:'bosuon-'+tag, renotify:true,
      icon:'./icon-192.png', badge:'./icon-192.png',
      vibrate:[80,40,80],
      data:{ reqId: reqId||null, room: room||null, url: location.href }
    };
    const reg = ('serviceWorker' in navigator) ? await navigator.serviceWorker.getRegistration() : null;
    if(reg && reg.showNotification){ reg.showNotification(title, opts); return; }
    const n = new Notification(title, opts);
    n.onclick = ()=>{ try{ window.focus(); openFromNoti(reqId, room); n.close(); }catch(e){} };
  }catch(e){ console.warn('notify', e); }
}
/* 알림을 눌렀을 때 해당 화면으로 이동 */
function openFromNoti(reqId, room){
  if(!state.user) return;
  if(reqId && R(reqId)) go('detail', reqId);
  else if(room){ try{ openRoom(room); }catch(e){ go('chat'); } }
}
if('serviceWorker' in navigator){

/* ===== XLSX 파서 (외부 라이브러리 없이 동작) ===== */
function decodeXml(t){ return t.replace(/&#(\d+);/g,(_,n)=>String.fromCharCode(n)).replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&amp;/g,'&'); }
async function parseXlsx(buf){
  const dv = new DataView(buf); const u8 = new Uint8Array(buf);
  let eocd = -1;
  for(let i=buf.byteLength-22; i>=Math.max(0,buf.byteLength-66000); i--){
    if(dv.getUint32(i,true)===0x06054b50){ eocd=i; break; }
  }
  if(eocd<0) throw new Error('.xlsx 형식이 아닙니다. 엑셀에서 [다른 이름으로 저장 → Excel 통합 문서(.xlsx)]로 저장 후 올려주세요 (구버전 .xls 불가)');
  const cnt = dv.getUint16(eocd+10,true), cdOff = dv.getUint32(eocd+16,true);
  const entries = {}; let p = cdOff;
  const td = new TextDecoder();
  for(let k=0;k<cnt;k++){
    if(dv.getUint32(p,true)!==0x02014b50) break;
    const method=dv.getUint16(p+10,true), csize=dv.getUint32(p+20,true),
      nlen=dv.getUint16(p+28,true), elen=dv.getUint16(p+30,true), clen=dv.getUint16(p+32,true),
      lho=dv.getUint32(p+42,true);
    entries[td.decode(u8.slice(p+46,p+46+nlen))]={method,csize,lho};
    p += 46+nlen+elen+clen;
  }
  async function read(name){
    const e = entries[name]; if(!e) return null;
    const q = e.lho;
    const nl = dv.getUint16(q+26,true), el = dv.getUint16(q+28,true);
    const data = u8.slice(q+30+nl+el, q+30+nl+el+e.csize);
    if(e.method===0) return td.decode(data);
    const stream = new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    return await new Response(stream).text();
  }
  const shared = [];
  const ss = await read('xl/sharedStrings.xml');
  if(ss){
    for(const si of ss.split('<si>').slice(1)){
      let t=''; const re=/<t[^>]*>([\s\S]*?)<\/t>/g; let m;
      while((m=re.exec(si))) t+=m[1];
      shared.push(decodeXml(t));
    }
  }
  const sheetName = Object.keys(entries).filter(n=>/^xl\/worksheets\/sheet\d+\.xml$/.test(n)).sort()[0];
  const sh = await read(sheetName);
  if(!sh) throw new Error('시트를 찾을 수 없습니다');
  const rows = [];
  const rowRe = /<row[^>]*>([\s\S]*?)<\/row>/g; let rm;
  while((rm=rowRe.exec(sh))){
    const cells = {};
    const cRe = /<c\s+([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g; let cm; let maxCol=0;
    while((cm=cRe.exec(rm[1]))){
      const attrs = cm[1], inner = cm[2]||'';
      const ref = /r="([A-Z]+)(\d+)"/.exec(attrs); if(!ref) continue;
      let col=0; for(const ch of ref[1]) col = col*26 + (ch.charCodeAt(0)-64); col--;
      const type = (/t="(\w+)"/.exec(attrs)||[])[1];
      let val = '';
      const v = /<v>([\s\S]*?)<\/v>/.exec(inner);
      if(type==='inlineStr'){ const t=/<t[^>]*>([\s\S]*?)<\/t>/.exec(inner); val = t?decodeXml(t[1]):''; }
      else if(type==='s'){ val = v?(shared[+v[1]]??''):''; }
      else { val = v?decodeXml(v[1]):''; }
      cells[col]=val; if(col>maxCol) maxCol=col;
    }
    const arr=[]; for(let i=0;i<=maxCol;i++) arr.push(cells[i]??'');
    rows.push(arr);
  }
  return rows;
}

/* ═══════════ 표준 견적서 양식 (.xlsx 생성 — 외부 라이브러리 없이) ═══════════
   보수공사·조명/타일 발주가 같은 양식을 씁니다.
   제목행: 품명 · 규격 · 단위 · 수량 · 단가 · 금액 · 비고
   하단행: 소계 / 일반관리비·이윤 / 합계
   이 양식으로 올리면 앱이 품목·금액을 자동 인식합니다. */
const QUOTE_COLS = ['품명','규격','단위','수량','단가','금액','비고'];

/* ZIP(무압축 저장) 방식으로 .xlsx 를 만든다 */
const CRC_TABLE = (()=>{ const t=new Uint32Array(256);
  for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c = c&1 ? 0xEDB88320^(c>>>1) : c>>>1; t[n]=c>>>0; }
  return t; })();
function crc32(u8){ let c=0xFFFFFFFF; for(let i=0;i<u8.length;i++) c = CRC_TABLE[(c^u8[i])&0xFF]^(c>>>8); return (c^0xFFFFFFFF)>>>0; }
function zipStore(files){   // files: [{name, text}]
  const enc = new TextEncoder();
  const locals = [], centrals = [];
  let offset = 0;
  files.forEach(f=>{
    const nameB = enc.encode(f.name), dataB = enc.encode(f.text);
    const crc = crc32(dataB);
    const lh = new Uint8Array(30 + nameB.length);
    const lv = new DataView(lh.buffer);
    lv.setUint32(0,0x04034b50,true); lv.setUint16(4,20,true); lv.setUint16(6,0,true); lv.setUint16(8,0,true);
    lv.setUint16(10,0,true); lv.setUint16(12,0,true);
    lv.setUint32(14,crc,true); lv.setUint32(18,dataB.length,true); lv.setUint32(22,dataB.length,true);
    lv.setUint16(26,nameB.length,true); lv.setUint16(28,0,true);
    lh.set(nameB,30);
    locals.push(lh, dataB);
    const ch = new Uint8Array(46 + nameB.length);
    const cv = new DataView(ch.buffer);
    cv.setUint32(0,0x02014b50,true); cv.setUint16(4,20,true); cv.setUint16(6,20,true);
    cv.setUint16(8,0,true); cv.setUint16(10,0,true); cv.setUint16(12,0,true); cv.setUint16(14,0,true);
    cv.setUint32(16,crc,true); cv.setUint32(20,dataB.length,true); cv.setUint32(24,dataB.length,true);
    cv.setUint16(28,nameB.length,true);
    cv.setUint32(42,offset,true);
    ch.set(nameB,46);
    centrals.push(ch);
    offset += lh.length + dataB.length;
  });
  const cdSize = centrals.reduce((s,c)=>s+c.length,0);
  const end = new Uint8Array(22); const ev = new DataView(end.buffer);
  ev.setUint32(0,0x06054b50,true);
  ev.setUint16(8,files.length,true); ev.setUint16(10,files.length,true);
  ev.setUint32(12,cdSize,true); ev.setUint32(16,offset,true);
  const total = offset + cdSize + 22;
  const out = new Uint8Array(total); let p=0;
  locals.forEach(b=>{ out.set(b,p); p+=b.length; });
  centrals.forEach(b=>{ out.set(b,p); p+=b.length; });
  out.set(end,p);
  return new Blob([out], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
const xmlEsc = s => String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function sheetXml(rows){
  const colLetter = i => { let s='', n=i+1; while(n>0){ const r=(n-1)%26; s=String.fromCharCode(65+r)+s; n=Math.floor((n-1)/26); } return s; };
  const body = rows.map((row,ri)=>{
    const cells = row.map((v,ci)=>{
      const ref = colLetter(ci)+(ri+1);
      if(v===''||v===null||v===undefined) return '';
      if(typeof v==='number') return `<c r="${ref}"><v>${v}</v></c>`;
      return `<c r="${ref}" t="inlineStr"><is><t xml:space="preserve">${xmlEsc(v)}</t></is></c>`;
    }).join('');
    return `<row r="${ri+1}">${cells}</row>`;
  }).join('');
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">
<cols><col min="1" max="1" width="30" customWidth="1"/><col min="2" max="2" width="26" customWidth="1"/><col min="3" max="3" width="8" customWidth="1"/><col min="4" max="6" width="13" customWidth="1"/><col min="7" max="7" width="22" customWidth="1"/></cols>
<sheetData>${body}</sheetData></worksheet>`;
}
function buildXlsx(rows, sheetName){
  return zipStore([
    {name:'[Content_Types].xml', text:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
<Default Extension="xml" ContentType="application/xml"/>
<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>
<Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>
</Types>`},
    {name:'_rels/.rels', text:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>

    ['합계','','','','',subTotal+overhead,''],
