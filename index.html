  toast('표준 견적서 양식을 내려받았습니다');
}

/* 표준 양식(또는 유사 표)에서 품목을 뽑아낸다 — 발주 견적 자동 입력용 */
function parseQuoteItems(rows){
  const RE = { name:/품명|품목|항목|내역|자재|공종/, spec:/규격|사양|스펙/, unit:/단위/, qty:/수량/, price:/단가/, amt:/금액|공급가/ };
  let hi=-1, c={};
  for(let i=0;i<Math.min(rows.length,30);i++){
    const cells = rows[i].map(x=>String(x).replace(/\s/g,''));
    if(cells.some(x=>RE.name.test(x)) && cells.some(x=>RE.price.test(x)||RE.amt.test(x))){
      hi=i;
      cells.forEach((x,j)=>{
        if(c.name===undefined && RE.name.test(x)) c.name=j;
        if(c.spec===undefined && RE.spec.test(x)) c.spec=j;
        if(c.unit===undefined && RE.unit.test(x) && !RE.price.test(x)) c.unit=j;
        if(c.qty===undefined && RE.qty.test(x)) c.qty=j;
        if(c.price===undefined && RE.price.test(x)) c.price=j;
        if(c.amt===undefined && RE.amt.test(x) && !RE.price.test(x)) c.amt=j;
      });
      break;
    }
  }
  if(hi<0 || c.name===undefined) return [];
  const items=[];
  for(let i=hi+1;i<rows.length;i++){
    const name = String(rows[i][c.name]??'').trim();
    const nm = name.replace(/\s/g,'');
    if(!name) continue;
    if(/^소계$|^합계$|^총계$|^계$|일반관리비|이윤|제경비|간접비|부가세|VAT/i.test(nm)) continue;
    if(/^※/.test(name)) continue;
    const qty = toNum(rows[i][c.qty]) ?? 0;
    const price = toNum(rows[i][c.price]) ?? 0;
    const amt = toNum(rows[i][c.amt]);
    if(!qty && !price && amt===null) continue;
    items.push({
      name, spec:String(rows[i][c.spec]??'').trim(),
      unit:String(rows[i][c.unit]??'EA').trim()||'EA',
      qty, price,
      amount: amt!==null ? amt : qty*price
    });
  }
  return items;
}

/* ===== 견적 자동검토 (규칙 기반) ===== */
const toNum = v => { const n = parseFloat(String(v??'').replace(/[,₩원\s]/g,'')); return isNaN(n)?null:n; };
function analyzeEstimate(rows, inputAmount){
  const NAME=/품명|품목|항목|내역|내용|공사명|자재|공종|규격명/, QTY=/수량/, UNIT=/단가/, AMT=/금액|공급가|합계/;
  let hi=-1, cols={};
  for(let i=0;i<Math.min(rows.length,30);i++){
    const cells = rows[i].map(c=>String(c).replace(/\s/g,''));  // '품 명'처럼 띄어쓴 제목도 인식
    if(cells.some(c=>NAME.test(c)) && cells.some(c=>UNIT.test(c)||AMT.test(c))){
      hi=i;
      cells.forEach((c,j)=>{
        if(cols.name===undefined && NAME.test(c)) cols.name=j;
        if(cols.qty===undefined && QTY.test(c)) cols.qty=j;
        if(cols.unit===undefined && UNIT.test(c)) cols.unit=j;
        if(cols.amt===undefined && AMT.test(c) && !UNIT.test(c)) cols.amt=j;
      });
      break;
    }
  }
  if(hi<0 || cols.name===undefined || cols.amt===undefined)
    return { ok:false, flags:['⚠ 표 형식을 인식하지 못했습니다 — 제목행에 「품명」과 「단가/금액」 열이 필요합니다. 본사 배포 표준 견적서 양식 사용을 권장합니다.'] };
  const items=[]; let sheetTotal=null, subTotal=null, overhead=null;
  for(let i=hi+1;i<rows.length;i++){
    const name = String(rows[i][cols.name]??'').trim();
    const nm = name.replace(/\s/g,'');
    const amt = toNum(rows[i][cols.amt]);
    if(/일반관리비|이윤|제경비|간접비/.test(nm)){ if(amt!==null) overhead=(overhead||0)+amt; continue; }
    if(/소계/.test(nm)){ if(amt!==null) subTotal=amt; continue; }
    if(/합계|총계/.test(nm) || /^계$/.test(nm) || (!name && amt!==null && i>hi+1)){
      if(amt!==null) sheetTotal = amt; continue;
    }
    if(!name || amt===null) continue;
    items.push({ name, qty:toNum(rows[i][cols.qty!==undefined?cols.qty:-1]), unit:toNum(rows[i][cols.unit!==undefined?cols.unit:-1]), amt });
  }
  const calcTotal = items.reduce((a,b)=>a+b.amt,0);
  const flags=[];
  let calcBad=0, unitMissing=0;
  items.forEach(it=>{
    if(it.qty!==null && it.unit!==null && Math.abs(it.qty*it.unit-it.amt)>1) calcBad++;
    if(cols.unit!==undefined && (it.unit===null||it.unit===0)) unitMissing++;
  });
  if(calcBad) flags.push(`⚠ 수량×단가 ≠ 금액 불일치 ${calcBad}건`); else if(cols.qty!==undefined&&cols.unit!==undefined) flags.push('✓ 수량×단가 검산 이상 없음');
  if(unitMissing) flags.push(`⚠ 단가 누락/0원 항목 ${unitMissing}건`);
  /* 소계 검산 */
  const baseSub = subTotal!==null ? subTotal : calcTotal;
  if(subTotal!==null && Math.abs(subTotal-calcTotal)>1) flags.push(`⚠ 소계(${money(subTotal)})와 항목 합산(${money(calcTotal)}) 불일치`);
  /* 일반관리비·이윤 10% 기준 검토 */
  if(overhead!==null){
    const pct = baseSub ? overhead/baseSub*100 : null;
    if(pct!==null){
      if(Math.abs(pct-10)<=0.6) flags.push(`✓ 일반관리비·이윤 10% 정상 반영 (${money(overhead)})`);
      else if(pct>10.6) flags.push(`⚠ 일반관리비·이윤 ${pct.toFixed(1)}% (${money(overhead)}) — 기준 10% 초과`);
      else flags.push(`ℹ 일반관리비·이윤 ${pct.toFixed(1)}% (${money(overhead)}) — 기준 10%보다 낮음`);
    }
  } else if(items.length){
    flags.push(`⚠ 일반관리비·이윤 항목 없음 — 소계의 10%(${money(Math.round(baseSub*0.1))}) 반영 기준입니다 (표준양식 사용 권장)`);
  }
  /* 총합계 검산: 소계 + 관리비 */
  const expectTotal = baseSub + (overhead||0);
  if(sheetTotal!==null && Math.abs(sheetTotal-expectTotal)>1) flags.push(`⚠ 총합계(${money(sheetTotal)})가 소계+관리비(${money(expectTotal)})와 불일치`);
  if(inputAmount){
    const base = sheetTotal ?? expectTotal;
    const diff = base ? Math.round((inputAmount-base)/base*100) : null;
    if(diff!==null && Math.abs(diff)>1) flags.push(`⚠ 입력 견적금액(${money(inputAmount)})이 엑셀 총합계보다 ${diff>0?'+':''}${diff}% ${diff>0?'높음':'낮음'}`);
    else flags.push('✓ 입력 금액과 엑셀 총합계 일치');
  }
  const past = state.reqs.filter(x=>x.id!==state.detailId).flatMap(x=>(x.estimates||[]).filter(e=>e.status==='승인').map(e=>e.amount)).filter(Boolean);
  let vsPast=null;
  if(past.length>=2 && inputAmount){
    const avg = past.reduce((a,b)=>a+b,0)/past.length;
    vsPast = Math.round((inputAmount-avg)/avg*100);
    flags.push(`ℹ 과거 승인 견적 평균(${money(Math.round(avg))}, ${past.length}건) 대비 ${vsPast>0?'+':''}${vsPast}%`);
  }
  const top = items.slice().sort((a,b)=>b.amt-a.amt).slice(0,3).map(it=>({name:it.name.slice(0,20), amt:it.amt}));

  /* ---- 노무비: 표준노임단가 대조 ---- */
  const laborTbl = (state.cfg.labor||[]).slice().sort((a,b)=>b[0].length-a[0].length);
  const norm = t => String(t).replace(/[\s()（）\[\]0-9인]/g,'');
  const labor=[], materials=[];
  items.forEach(it=>{
    const n = norm(it.name);
    let hit = laborTbl.find(([job])=>n.includes(norm(job)));
    if(!hit){
      for(const [alias,job] of Object.entries(LABOR_ALIAS)){
        if(n.includes(norm(alias))){ hit = laborTbl.find(([j])=>j===job); break; }
      }
    }
    if(hit && it.unit){
      const pct = Math.round((it.unit-hit[1])/hit[1]*100);
      labor.push({name:it.name.slice(0,20), job:hit[0], unit:it.unit, std:hit[1], pct});
    } else if(/인건비|노무비|공임|시공비|인력/.test(it.name) && !hit){
      labor.push({name:it.name.slice(0,20), job:null});
    } else {
      materials.push({name:it.name.slice(0,30), amt:it.amt, unit:it.unit});
    }
  });
  labor.forEach(l=>{
    if(l.job===null) flags.push(`ℹ 「${l.name}」 — 직종명이 없어 표준노임 대조 불가 (직종 기재 요청 권장)`);
    else if(l.pct>5) flags.push(`⚠ 노무비: ${l.name} ${money(l.unit)}/일 — 표준노임(${l.job} ${money(l.std)}) 대비 +${l.pct}%`);
    else flags.push(`✓ 노무비: ${l.name} ${money(l.unit)}/일 — 표준노임(${l.job}) 대비 ${l.pct>0?'+':''}${l.pct}% (적정)`);
  });
  const matTop = materials.sort((a,b)=>b.amt-a.amt).slice(0,5);
  return { ok:true, itemCount:items.length, calcTotal, sheetTotal, subTotal:baseSub, overhead, flags, top, laborCount:labor.filter(l=>l.job).length, materials:matTop, laborNote:state.cfg.laborNote||'' };
}

    ${a.top&&a.top.length?`<div class="kv"><b>고액 항목</b>${a.top.map(t=>`${esc(t.name)} (${money(t.amt)})`).join(', ')}</div>`:''}` : '';

      <div style="font-size:11.5px;color:var(--sub);margin-top:4px">· 버튼을 누르면 네이버쇼핑 검색 결과가 열립니다 (인터넷 시세 확인용)</div>`:''}
  </div>`;
}

/* 시공사 전용 접속코드 — 자동 발급 / 직접 입력 둘 다 가능 */
function makeBuilderCode(){
  const CH='ACDEFGHJKLMNPQRTUVWXY34679';   // 헷갈리는 글자(0,O,1,I,S,5,B,8,2,Z) 제외
  let s=''; for(let i=0;i<6;i++) s+=CH[Math.floor(Math.random()*CH.length)];
  return 'BLD-'+s.slice(0,3)+'-'+s.slice(3);
}
async function genBuilderCode(b){
  const codes = {...(state.cfg.builderCodes||{})};
  const cur = codes[b];
  if(cur && !confirm(`「${b}」의 접속코드를 새로 발급할까요?\n기존 코드(${cur})는 즉시 사용할 수 없게 됩니다.`)) return;
  let c; const used = Object.values(codes);
  do { c = makeBuilderCode(); } while(used.includes(c));
  codes[b] = c;
  try{ await store.saveConfig({builderCodes:codes}); toast(`${b} 코드 발급: ${c}`); render(); }
  catch(e){ toast('저장 실패'); }
}
async function setBuilderCode(b, v){
  const codes = {...(state.cfg.builderCodes||{})};
  const val = String(v||'').trim();
  if(!val){ delete codes[b]; }
  else {
    const dup = Object.entries(codes).find(([k,c])=>k!==b && c===val);
    if(dup){ toast(`${dup[0]}와 코드가 중복됩니다`); render(); return; }
    codes[b] = val;
  }
  try{ await store.saveConfig({builderCodes:codes}); toast(val?'코드가 변경되었습니다':'전용코드를 해제했습니다 (공용코드 사용)'); render(); }
  catch(e){ toast('저장 실패'); }
}
function copyBuilderCode(b){
  const c = (state.cfg.builderCodes||{})[b] || '';
  const txt = `[GRS 보수ON] ${b} 접속 안내\n주소: ${location.origin+location.pathname}\n소속: 인테리어 시공사 → ${b}\n접속코드: ${c}`;

}

let storeUploadList = [];
async function pickStoreFile(inp){
  const f = inp.files[0]; if(!f) return;
  try{
    const rows = await parseXlsx(await f.arrayBuffer());
    const names = [];
    for(const row of rows){
      const a = String(row[0]??'').trim();
      const b = String(row[1]??'').trim();
      if(!a && !b) continue;
      if(/브랜드|점포명|매장명|상호/.test(a+b) && names.length===0) continue; // 제목행 건너뛰기
      names.push(a && b ? `${a} ${b}` : (a||b));
    }
    storeUploadList = [...new Set(names.map(n=>n.replace(/\s+/g,' ').trim()).filter(Boolean))];
    if(storeUploadList.length<1){ toast('점포를 인식하지 못했습니다 (A열 브랜드명, B열 점포명 확인)'); inp.value=''; return; }
    openModal(`<h2>점포목록 엑셀 인식 결과</h2>
      <div class="sub">${esc(f.name)} — <b>${storeUploadList.length}개</b> 점포 인식</div>
      <div class="note" style="margin-top:10px">${storeUploadList.slice(0,6).map(esc).join('<br>')}${storeUploadList.length>6?`<br>… 외 ${storeUploadList.length-6}개`:''}</div>
      <div style="display:flex;gap:8px;margin-top:12px">
        <button class="btn sec2" style="flex:1" onclick="applyStoreUpload(false)">기존 목록에 추가</button>
        <button class="btn" style="flex:1" onclick="applyStoreUpload(true)">전체 교체</button>
      </div>`);
  }catch(e){ toast('파일 처리 실패: '+(e.message||e)); }
  inp.value='';
}
async function applyStoreUpload(replace){
  if(replace && !confirm(`기존 점포 목록을 지우고 ${storeUploadList.length}개로 교체할까요?`)) return;
  const merged = replace ? storeUploadList : [...new Set([...state.cfg.stores.map(String), ...storeUploadList])];
  try{
    await store.saveConfig({stores:merged});
    closeModal(); toast(`점포 ${storeUploadList.length}개 ${replace?'교체':'추가'} 완료 (총 ${merged.length}개)`);

async function pickLaborFile(inp){
  const f = inp.files[0]; if(!f) return;
  try{
    const rows = await parseXlsx(await f.arrayBuffer());
    const list = [];
    for(const row of rows){
      let name=null, rate=null;
      for(const cell of row){
        const n = toNum(cell);
        if(n!==null && n>50000 && n<2000000 && rate===null) rate=n;
        else if(typeof cell==='string' && /[가-힣]{2,}/.test(cell) && name===null) name=cell.trim();
      }
      if(name && rate) list.push([name, rate]);
    }
    if(list.length<5){ toast('직종·단가 표를 인식하지 못했습니다 (직종명·단가 열 확인)'); return; }
    const d = new Date();
    await store.saveConfig({labor:list, laborNote:`${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')} 업로드 (${f.name})`});
    toast(`표준노임 ${list.length}개 직종 등록 완료`); render();
  }catch(e){ toast('파일 처리 실패: '+(e.message||e)); }
  inp.value='';
}

async function bdSave(){

  const text = document.getElementById('bdText').value.trim();
  if(!title){ toast('제목을 입력해주세요'); return; }
  if(!text){ toast('내용을 입력해주세요'); return; }
  const d = new Date();
  const id = `B-${String(d.getFullYear()).slice(2)}${pad2(d.getMonth()+1)}-${rnd4()}`;

    type:document.getElementById('bdType').value, title, text, status:'OPEN',

  try{
    await store.savePost(post);

      try{ await store.addFile('B:'+id, {kind:'shot', name:`화면_${i+1}.jpg`, data:bdPhotos[i], ts:now(), by:actorLabel()}); }catch(e){}

async function bdAddReply(id){
  const el = document.getElementById('bdReply');
  const t = el.value.trim(); if(!t) return;
  const r = { ts:now(), author:actorLabel(), role:role(), text:t };
  try{
    await store.addReply(id, r);
    el.value='';
    if(role()==='hq'){
      const p=(state.posts||[]).find(x=>x.id===id);
      if(p && p.status==='OPEN') await store.updatePost(id, {status:'DOING'});
    }
    render(); toast('답변이 등록되었습니다');
  }catch(e){ toast('저장 실패: '+(e.code||e.message)); }

async function bdSetStatus(id, st){
  try{ await store.updatePost(id, {status:st}); toast(`「${BD_ST[st]}」로 변경했습니다`); render(); }
  catch(e){ toast('저장 실패'); }
}
async function bdDelete(id){
  if(!confirm('이 글을 삭제할까요? 되돌릴 수 없습니다.')) return;
  try{ await store.deletePost(id); toast('삭제되었습니다'); go('board'); }
  catch(e){ toast('삭제 실패: '+(e.code||e.message)); }
}

/* ══════════════════════════════════════════════════════════
   조명·타일 발주 시스템
   도면제공 → 견적 → 확정 → 납품일협의 → 납품·확인서 → 정산
   ══════════════════════════════════════════════════════════ */
const oRoleNote = () => roleNote();

/* ── 발주 대시보드 ── */
function vODash(){
  const list = visibleOrders();
  const cnt = s => list.filter(o=>o.stage===s).length;
  const over = list.filter(o=>O_LIVE(o) && oIsOver(o));
  const thisYm = ymOf(now());
  /* 정산 대기 = 납품 완료됐지만 아직 정산 안 된 건 */
  const pending = list.filter(o=>o.stage==='DELIVERED');
  const pendingAmt = pending.reduce((s,o)=>s+(oAmount(o)||0),0);
  const doneAmt = list.filter(o=>o.stage==='SETTLED' && o.settle && ymOf(o.settle.at)===thisYm)
                      .reduce((s,o)=>s+(oAmount(o)||0),0);
  const badRcpt = list.filter(o=>O_LIVE(o) && o.receipt && o.receipt.allOk===false);

  const tile = (v,label,val,cls) => `<button class="tile ${cls||''}" onclick="oGoList('${v}')">
    <div class="n">${val}</div><div class="t">${label} ›</div></button>`;

  return oRoleNote()+`
  <div class="card">
    <div class="h2">📦 발주 진행 현황</div>
    <div class="tiles">
      ${tile('DRAWING','견적 대기',cnt('DRAWING'))}
      ${tile('QUOTE','승인 대기',cnt('QUOTE'))}
      ${role()==='hq'?tile('HQAPV','시공사 승인 대기',cnt('HQAPV')):tile('HQAPV','내 승인 대기',cnt('HQAPV'))}
      ${tile('APPROVED','납품일 협의',cnt('APPROVED'))}
      ${tile('SCHED','납품 대기',cnt('SCHED'))}
      ${tile('DELIVERED','정산 대기',cnt('DELIVERED'))}
      ${tile('ALL','전체',list.filter(O_LIVE).length)}
      ${list.some(o=>!O_LIVE(o))?tile('CANCEL','⛔ 중단',list.filter(o=>!O_LIVE(o)).length):''}
    </div>
  </div>

  ${over.length?`<div class="card">
    <div class="h2">⚠ 기한 초과 <span class="badge b-overdue">${over.length}건</span></div>
    ${over.slice(0,5).map(o=>`<button class="rowbtn" onclick="goOrder('${o.id}')" style="width:100%;text-align:left">
      <div class="note warn" style="margin-top:6px">[${o.id}] ${esc(o.site)} · ${O_NM[o.stage]} ${-oDdays(o)}일 초과 — ${O_OWNER(o)} 조치 필요</div>
    </button>`).join('')}
  </div>`:''}

  ${badRcpt.length?`<div class="card">
    <div class="h2">🚨 납품 이상 보고 <span class="badge b-red">${badRcpt.length}건</span></div>
    ${badRcpt.map(o=>`<button style="width:100%;text-align:left" onclick="goOrder('${o.id}')">
      <div class="note warn" style="margin-top:6px">[${o.id}] ${esc(o.site)} · ${esc(o.receipt.shortItems||o.receipt.note||'이상 있음')}</div></button>`).join('')}
  </div>`:''}

  <div class="card">
    <div class="h2">💰 정산 현황</div>
    <div class="kv"><b style="width:118px">정산 대기</b><strong>${money(pendingAmt)}</strong> <span style="color:var(--sub);font-size:12.5px;margin-left:6px">${pending.length}건</span></div>
    <div class="kv"><b style="width:118px">${ymLabel(thisYm)} 완료</b><strong style="color:var(--green)">${money(doneAmt)}</strong></div>
    <div class="kv"><b style="width:118px">└ 직영점 대기</b>${pending.filter(o=>o.type==='직영점').length}건 · ${money(pending.filter(o=>o.type==='직영점').reduce((s,o)=>s+(oAmount(o)||0),0))}</div>
    <div class="kv"><b style="width:118px">└ 가맹점 대기</b>${pending.filter(o=>o.type==='가맹점').length}건 · ${money(pending.filter(o=>o.type==='가맹점').reduce((s,o)=>s+(oAmount(o)||0),0))}</div>
    ${role()==='hq'?`<button class="btn sec2 blk" onclick="go('settle')">📊 월별 정산 관리로 이동</button>`:''}
  </div>

  <div class="card">
    <div class="h2">🕒 최근 발주</div>
    ${list.filter(O_LIVE).slice().sort((a,b)=>b.stageAt-a.stageAt).slice(0,6).map(oRow).join('') || '<div class="empty">발주 건이 없습니다</div>'}
  </div>`;
}
function oGoList(f){ state.oFilter=f; state.oCat='ALL'; state.oq=''; go('olist'); }

/* ── 발주 목록 ── */
function oRow(o){
  const amt = oAmount(o);
  const st = oStages(o);
  const idx = st.indexOf(o.stage);
  const bar = st.slice(0,st.length-1).map((x,i)=>`<i class="${i<idx?'done':(i===idx&&o.stage!=='SETTLED'?'cur':(o.stage==='SETTLED'?'done':''))}"></i>`).join('');
  return `<button class="card req" onclick="goOrder('${o.id}')">
    <div class="row1">
      <span class="id">${o.id}</span>
      <span class="badge ${O_BADGE[o.stage]||'b-gray'}">${oWait(o)}</span>
      <span class="badge ${o.type==='직영점'?'b-blue':'b-gray'}">${o.type}</span>
      <span class="badge ${oIsDir(o)?'b-blue':'b-gray'}">${oProcNm(o)}</span>
      ${o.receipt&&!o.receipt.allOk?'<span class="badge b-red">납품 이상</span>':''}
    </div>
    <h3>${esc(o.site)}</h3>
    <div class="meta">${esc(o.supplier)} → ${esc(o.builder)}${amt!=null?` · ${money(amt)}`:''}</div>
    <div class="row2"><div class="minibar">${bar}</div>${o.stage==='SETTLED'?'<span class="badge b-green">정산완료</span>':oDdayBadge(o)}</div>
  </button>`;
}
function vOList(){
  let list = visibleOrders();
  if(state.oFilter==='ALL') list = list.filter(O_LIVE);          // 중단건은 「⛔ 중단」에서만
  else list = list.filter(o=>o.stage===state.oFilter);
  if(state.oCat!=='ALL') list = list.filter(o=>o.cat===state.oCat);
  const q = (state.oq||'').trim().toLowerCase();
  if(q) list = list.filter(o=>[o.id,o.site,o.builder,o.supplier].join(' ').toLowerCase().includes(q));
  list = list.slice().sort((a,b)=>b.createdAt-a.createdAt);

  const chip = (v,label,cur,fn) => `<button class="${cur===v?'on':''}" onclick="${fn}('${v}')">${label}</button>`;
  return oRoleNote()+`<div class="card">
    <input id="oq" placeholder="🔍 현장·시공사·발주번호 검색" value="${esc(state.oq||'')}"
      oninput="state.oq=this.value;render();refocusSearch('oq')">
    <div class="chips" style="margin-top:10px">
      ${chip('ALL','전체',state.oFilter,'oSetFilter')}
      ${O_STAGES.map(s=>chip(s,O_NM[s],state.oFilter,'oSetFilter')).join('')}
      ${chip('CANCEL','⛔ 중단',state.oFilter,'oSetFilter')}
    </div>
    <div class="chips">
      ${chip('ALL','조명+타일',state.oCat,'oSetCat')}
      ${chip('조명','💡 조명',state.oCat,'oSetCat')}
      ${chip('타일','🧱 타일',state.oCat,'oSetCat')}
    </div>
    <div style="font-size:12.5px;color:var(--sub);margin-bottom:8px">${list.length}건</div>
    ${list.map(oRow).join('') || '<div class="empty">해당하는 발주 건이 없습니다</div>'}
  </div>`;
}
function oSetFilter(v){ state.oFilter=v; render(); }
function oSetCat(v){ state.oCat=v; render(); }

/* ── 발주 상세 ── */
/* 스테퍼는 그 발주가 따르는 프로세스의 단계만 보여준다 */
function oStepper(o){
  const st = oStages(o);
  const idx = st.indexOf(o.stage);
  return `<div class="stepper">${st.map((s,i)=>{
    const done = (idx>=0 && i<idx) || o.stage==='SETTLED';
    return `<div class="step ${done?'done':(i===idx?'cur':'')}"><div class="dot">${done?'✓':i+1}</div>${O_SHORT[s]}</div>`;
  }).join('')}</div>`;
}
function itemsTable(items, freight){
  const total = items.reduce((s,x)=>s+(x.amount||0),0);
  const hasImg = items.some(x=>x.img);
  const grand = total + (freight?freight.amount:0);
  return `<div class="tscroll"><table class="itab">
    <thead><tr>${hasImg?'<th></th>':''}<th>품목</th><th>규격</th><th class="num">단위</th><th class="num">수량</th><th class="num">단가</th><th class="num">금액</th></tr></thead>
    <tbody>${items.map(x=>`<tr>
      ${hasImg?`<td>${x.img?`<img class="ic" src="${x.img}" alt="">`:''}</td>`:''}
      <td style="font-weight:700">${x.code?`<span style="font-size:11px;color:var(--sub);display:block">${esc(x.code)}</span>`:''}${esc(x.name)}</td>
      <td style="color:var(--sub)">${esc(x.spec||'')}</td>
      <td class="num">${esc(x.unit||'')}</td><td class="num">${Number(x.qty).toLocaleString('ko-KR')}</td>
      <td class="num">${Number(x.price).toLocaleString('ko-KR')}</td><td class="num">${Number(x.amount).toLocaleString('ko-KR')}</td>
    </tr>`).join('')}
    ${freight?`<tr><td${hasImg?' colspan="2"':''} style="font-weight:700">운반비 <span style="font-size:11px;color:var(--sub);display:block">${esc(freight.area)} · ${esc(freight.note||'')}</span></td>
      <td colspan="4" class="num"></td><td class="num">${Number(freight.amount).toLocaleString('ko-KR')}</td></tr>`:''}</tbody>
    <tfoot><tr><td colspan="${(hasImg?6:5)}">합계 (${items.length}개 품목${freight?' + 운반비':''})</td><td class="num">${grand.toLocaleString('ko-KR')}</td></tr></tfoot>
  </table></div>`;
}
function oSlaTag(o, stage){
  if(o.stage!==stage) return '';
  const d = oDdays(o);
  if(d===null) return '';
  if(d<0) return `<span class="badge b-overdue">기한 ${-d}일 초과</span>`;
  return `<span class="badge b-amber">기한 D-${d}</span>`;
}

    s += `<div class="kv"><b>견적금액</b><strong style="font-size:15px">${money(o.quote.amount)}</strong></div>
      <div class="kv"><b>견적일</b>${fmtD(o.quote.ts)}</div>
      ${o.quote.readyDate?`<div class="kv"><b>납품 가능일</b><strong>${fmtD(o.quote.readyDate)}</strong></div>`:''}
      ${o.quote.fileName?`<div class="kv"><b>첨부</b>📎 ${esc(o.quote.fileName)}</div>`:''}
      ${o.quote.note?`<div class="kv"><b>비고</b>${esc(o.quote.note)}</div>`:''}
      ${itemsTable(o.quote.items||[], o.quote.freight)}`;
    if(o.quote.analysis) s += analysisHtml(o.quote.analysis);
    s += fileListHtml('O:'+o.id, ['quote'], '📥 견적서 파일');
  } else {
    s += `<div class="note">${o.supplier}의 수량산출·견적서 제출 대기중입니다.</div>`;
  }
  if(oCanAct(o,'DRAWING'))
    s += `<button class="btn blk" onclick="oQuoteModal('${o.id}')">📤 수량산출·견적서 제출</button>`;
  if(rl==='supplier' && o.supplier===myCo() && o.stage==='QUOTE')
    s += `<button class="btn sec2 blk" onclick="oQuoteModal('${o.id}')">✏ 견적 수정 (확정 전)</button>`;
  s += `</div>`;

  /* 3. 검토·확정 */
  /* 3. 승인 — 직영은 본사승인 후 시공사승인, 가맹은 시공사승인만 */
  if(oIsDir(o)){
    s += `<div class="sec"><div class="st">🏢 3. 본사 승인 ${oSlaTag(o,'QUOTE')}
      <span class="badge b-gray">GRS 공사담당</span></div>`;
    if(o.confirm){
      s += `<div class="kv"><b>결과</b><span class="badge b-green">${o.confirm.decision}</span></div>
        <div class="kv"><b>승인금액</b><strong>${money(o.confirm.finalAmount)}</strong></div>
        <div class="kv"><b>승인자</b>${esc(o.confirm.by)} · ${fmtDT(o.confirm.at)}</div>
        ${o.confirm.opinion?`<div class="kv"><b>의견</b>${esc(o.confirm.opinion)}</div>`:''}`;
    } else s += `<div class="note">${o.quote?'본사 검토 대기중입니다.':'견적 제출 후 검토합니다.'}</div>`;
    if(oCanAct(o,'QUOTE')) s += `<button class="btn blk" onclick="oConfirmModal('${o.id}')">✍ 본사 승인 처리</button>`;
    s += `</div>`;
  }

  /* 시공사 승인 — 합의된 물량을 시공사가 최종 확인 */
  s += `<div class="sec"><div class="st">🏗 ${oIsDir(o)?'4':'3'}. 시공사 승인 ${oSlaTag(o, oIsDir(o)?'HQAPV':'QUOTE')}
    <span class="badge b-gray">${esc(o.builder)} 현장소장</span></div>`;
  if(o.bldConfirm){
    s += `<div class="kv"><b>결과</b><span class="badge b-green">${o.bldConfirm.decision}</span></div>
      <div class="kv"><b>확정금액</b><strong>${money(o.bldConfirm.finalAmount)}</strong></div>
      <div class="kv"><b>승인자</b>${esc(o.bldConfirm.by)} · ${fmtDT(o.bldConfirm.at)}</div>
      ${o.bldConfirm.opinion?`<div class="kv"><b>의견</b>${esc(o.bldConfirm.opinion)}</div>`:''}
      <div class="note">✅ 시공사가 물량·금액에 동의한 기록입니다.</div>`;
  } else {
    const waitMsg = !o.quote ? '견적 제출 후 진행합니다.'
      : (oIsDir(o) && !o.confirm) ? '본사 승인 후 시공사가 확인합니다.'
      : `${esc(o.builder)} 확인 대기중입니다.`;
    s += `<div class="note">${waitMsg}</div>`;
  }
  if(oCanAct(o, oIsDir(o)?'HQAPV':'QUOTE'))
    s += `<div class="note">아래 물량과 금액에 이의가 없으면 승인해주세요. 승인 후에는 이 내용으로 납품이 진행됩니다.</div>
      <button class="btn blk grn" onclick="oBldConfirmModal('${o.id}')">✅ 시공사 승인 처리</button>`;
  s += `</div>`;

  /* 4. 납품일 협의 */
  s += `<div class="sec"><div class="st">🚚 ${oIsDir(o)?'5':'4'}. 납품일 협의 ${oSlaTag(o,'APPROVED')}
    <span class="badge b-gray">시공사 ↔ 공급사</span></div>`;
  if(o.sched){
    s += `<div class="kv"><b>납품 예정일</b><strong>${fmtD(o.sched.planDate)}</strong></div>
      <div class="kv"><b>납품 장소</b>${esc(o.sched.place||'-')}</div>
      <div class="kv"><b>협의</b>${esc(o.sched.agreedBy)} · ${fmtDT(o.sched.agreedAt)}</div>
      ${o.sched.note?`<div class="kv"><b>요청사항</b>${esc(o.sched.note)}</div>`:''}`;
  } else s += `<div class="note">${o.bldConfirm?'시공사와 공급사가 납품일을 협의해 등록해주세요.':'승인 완료 후 협의합니다.'}</div>`;
  if(oCanAct(o,'APPROVED'))
    s += `<button class="btn blk" onclick="oSchedModal('${o.id}')">📅 납품일 협의 등록</button>`;
  if(o.stage==='SCHED' && ((rl==='builder'&&o.builder===myCo())||(rl==='supplier'&&o.supplier===myCo())))
    s += `<button class="btn sec2 blk" onclick="oSchedModal('${o.id}')">✏ 납품일 변경</button>`;
  s += `</div>`;

  /* 5. 납품 · 물품납품확인서 */
  s += `<div class="sec"><div class="st">📦 ${oIsDir(o)?'6':'5'}. 물품 납품·확인서 ${oSlaTag(o,'SCHED')}</div>`;
  if(o.receipt){
    s += `<div class="kv"><b>수령일</b>${fmtDT(o.receipt.receivedAt)}</div>
      <div class="kv"><b>수령자</b>${esc(o.receipt.receiver)}</div>
      <div class="kv"><b>검수결과</b>${o.receipt.allOk
        ? '<span class="badge b-green">전 품목 이상 없음</span>'
        : `<span class="badge b-red">이상 있음</span>`}</div>
      ${o.receipt.shortItems?`<div class="note warn">🚨 ${esc(o.receipt.shortItems)}</div>`:''}
      ${o.receipt.note?`<div class="kv"><b>비고</b>${esc(o.receipt.note)}</div>`:''}`;
    /* 납품 사진 */
    const dp = photosHtml('O:'+o.id, 'delivery');
    s += `<div class="kv" style="margin-top:6px"><b>납품 사진</b>${o.receipt.photoCount||((filesCache['O:'+o.id]||[]).filter(f=>f.kind==='delivery').length)||0}장</div>`;
    s += dp || `<div class="note">첨부된 납품 사진이 없습니다.</div>`;
    if(oCanAct2Receipt(o))
      s += `<input type="file" id="rcAddF" accept="image/*" multiple style="display:none" onchange="oAddDeliveryPhotos('${o.id}',this)">
        <button class="btn sec2 blk" onclick="document.getElementById('rcAddF').click()">📷 납품 사진 추가</button>`;
    s += `<div class="kv" style="margin-top:8px"><b>서명</b><span class="badge b-green">서명 완료</span>&nbsp;${esc(o.receipt.signBy)} · ${fmtDT(o.receipt.signAt)}</div>`;
    const sg = (filesCache['O:'+o.id]||[]).find(f=>f.kind==='osign');
    if(sg) s += `<img class="signimg" src="${sg.data}" alt="서명">`;
    s += `<button class="btn sec2 blk" onclick="printReceipt('${o.id}')">📄 물품납품확인서 출력 (PDF 저장)</button>`;
  } else {
    s += `<div class="note">${o.sched?`납품 예정일 ${fmtD(o.sched.planDate)} — 물품 수령 후 시공사가 납품확인서를 작성·서명합니다.`:'납품일 협의 후 진행합니다.'}</div>`;
  }
  if(oCanAct(o,'SCHED'))
    s += `<button class="btn blk grn" onclick="oReceiptModal('${o.id}')">✍ 물품 수령 · 납품확인서 작성</button>`;
  s += `</div>`;

  /* 6. 정산 */
  s += `<div class="sec"><div class="st">💰 ${oIsDir(o)?'7':'6'}. 정산 <span class="badge b-gray">${oSettleNm(o)}</span></div>`;
  if(o.settle){
    s += `<div class="kv"><b>정산금액</b><strong>${money(o.settle.amount)}</strong></div>
      <div class="kv"><b>정산방식</b>${esc(o.settle.method)}</div>
      <div class="kv"><b>정산월</b>${ymLabel(o.settle.month)}</div>
      <div class="kv"><b>처리</b>${esc(o.settle.by)} · ${fmtDT(o.settle.at)}</div>
      ${o.settle.note?`<div class="kv"><b>비고</b>${esc(o.settle.note)}</div>`:''}`;
  } else s += `<div class="note">${o.receipt?`납품확인 완료 — ${oSettleNm(o)} 대기중입니다.`:'납품 확인 후 정산합니다.'}</div>`;
  if(oCanAct(o,'DELIVERED'))
    s += `<button class="btn blk" onclick="oSettleModal('${o.id}')">💳 정산 처리</button>`;
  s += `</div>`;

  /* 의견·댓글 — 관계자 소통용 */
  s += `<div class="sec"><div class="st">💬 의견·댓글 <span class="badge b-gray">${(o.comments||[]).length}</span></div>
    ${(o.comments||[]).slice().sort((a,b)=>a.ts-b.ts).map(cm=>`<div class="cmt"><div class="who">${esc(cm.author)}<span>${fmtDT(cm.ts)}</span></div>${esc(cm.text)}</div>`).join('')
      || '<div class="note">아직 의견이 없습니다. 물량·납품 관련 사항을 남겨보세요.</div>'}
    <div style="display:flex;gap:8px;margin-top:8px">
      <input id="oCmtIn" placeholder="의견을 입력하세요 (관계자 전체 공개)">
      <button class="btn sm" style="flex-shrink:0" onclick="addOCmt('${o.id}')">등록</button>
    </div></div>`;

  /* 전체 첨부파일 */
  {
    const key = 'O:'+o.id;
    const all = filesCache[key]||[];
    const box = fileListHtml(key, ['drawing','quote','delivery','osign'], '전체 첨부파일');
    s += `<div class="sec"><div class="st">📎 첨부파일 <span class="badge b-gray">${all.length}</span></div>
      ${box || '<div class="note">첨부된 파일이 없습니다.</div>'}</div>`;
  }

  /* 이력 */
  s += `<div class="sec"><div class="st">🕘 처리 이력</div><div class="hist">
    ${(o.history||[]).slice().sort((a,b)=>b.ts-a.ts).map(h=>`<div class="hitem"><div>${esc(h.actor)} — ${esc(h.action)}</div><div class="ts">${fmtDT(h.ts)}</div></div>`).join('')}
  </div></div>`;

  const overWarn = (o.stage!=='CANCEL' && oIsOver(o)) ? `<div class="note warn" style="margin-bottom:10px">⚠ 「${O_NM[o.stage]}」 단계가 처리기한을 ${-oDdays(o)}일 초과했습니다. (${O_OWNER(o)} 조치 필요)</div>` : '';
  const cancelBanner = o.stage==='CANCEL' ? `<div class="note warn" style="margin-bottom:10px">⛔ 중단된 발주입니다 — ${esc(o.cancelReason||'사유 미기재')}<div style="font-size:11.5px;margin-top:3px">${esc(o.cancelBy||'')} · ${o.cancelAt?fmtDT(o.cancelAt):''}</div></div>` : '';
  const canEdit = rl==='hq' && o.stage!=='SETTLED';
  const bottomBtns = `<div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end">
    ${canEdit?`<button style="font-size:12.5px;color:var(--sub);font-weight:700;text-decoration:underline" onclick="oEditModal('${o.id}')">✏ 발주 정보 수정</button>`:''}
    ${rl==='hq' && o.stage!=='SETTLED' && o.stage!=='CANCEL'?`<button style="font-size:12.5px;color:var(--red-dark);font-weight:800" onclick="oCancelModal('${o.id}')">⛔ 발주 중단 처리</button>`:''}
    ${rl==='hq' && o.stage==='CANCEL'?`<button style="font-size:12.5px;color:var(--sub);font-weight:700;text-decoration:underline" onclick="oResume('${o.id}')">↩ 중단 취소 (되돌리기)</button>`:''}
  </div>`;

  return `<button class="back" onclick="go('olist')">← 목록으로</button>
    <div class="card">
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <span style="font-size:12px;color:var(--sub);font-weight:700">${o.id}</span>
        <span class="badge ${O_BADGE[o.stage]||'b-gray'}">${oWait(o)}</span>
        <span class="badge ${o.type==='직영점'?'b-blue':'b-gray'}">${o.type}</span>
      </div>
      <h3 style="font-size:18px;font-weight:800;margin-top:6px">${CAT_ICON[o.cat]} ${esc(o.site)} · ${o.cat} 발주</h3>
      <div style="color:var(--sub);font-size:13px">${esc(o.supplier)} → ${esc(o.builder)}</div>
      ${o.stage==='CANCEL'?'':oStepper(o)} ${cancelBanner} ${overWarn} ${s} ${bottomBtns}
    </div>`;
}

function oTypeHint(){
  const t = document.getElementById('oType').value;
  const cat = appCat(state.app) || '조명';
  const pre = cat==='조명' && now() < lightContractTs();
  const el = document.getElementById('oTypeNote'); if(!el) return;
  const priceLine = pre
    ? `<br>🔦 계약 시행 전이라 <b>${esc(specPrev().maker)} 재고 물량 단가</b>가 적용됩니다 (${prevPriceNote()}).`
    : '';
  if(t==='가맹점'){
    el.className = pre ? 'note warn' : 'note';
    el.innerHTML = '가맹 방식 — <b>시공사 발주 → 공급사 견적 → 시공사 승인 → 납품 → 시공사 개별정산</b>' + priceLine;
  } else if(pre){
    el.className='note warn';
    el.innerHTML = `💡 조명 공급계약 시행(${state.cfg.lightContract||DEFAULT_LIGHT_CONTRACT}) 전이라
      직영점도 <b>가맹점과 같은 방식</b>으로 진행됩니다 (시공사 승인·개별정산).` + priceLine;
  } else {
    el.className='note';
    el.innerHTML = '직영 방식 — <b>GRS 발주 → 공급사 견적 → 본사 승인 → 시공사 승인 → 납품 → GRS 정산</b>';
  }
}
let oNewDrawings = [];
async function oPickDrawings(inp){
  for(const f of [...inp.files]){
    try{
      const d = f.type.startsWith('image/') ? await compressImage(f,1600,0.72) : await readSmallFile(f);
      oNewDrawings.push({name:f.name, data:d});
    }catch(e){ toast('도면 처리 실패: '+f.name+' — '+e.message); }
  }
  inp.value='';
  document.getElementById('oPrev').innerHTML = oNewDrawings.map(d=>
    d.data.startsWith('data:image') ? `<img src="${d.data}">` : `<div class="imgfail">📕 ${esc(d.name.slice(0,14))}</div>`).join('');
}
async function submitOrder(){
  const site = document.getElementById('oSite').value.trim();
  if(!site){ toast('현장명을 입력해주세요'); return; }
  const type = document.getElementById('oType').value;
  const cat  = document.getElementById('oCat').value || appCat(state.app) || '조명';
  const d = new Date();
  const id = `O-${String(d.getFullYear()).slice(2)}${pad2(d.getMonth()+1)}-${cat==='조명'?'L':'T'}${rnd4().slice(0,3)}`;
  const o = {
    id, type, cat, supplier:SUPPLIER_OF[cat], builder:document.getElementById('oBuilder').value,
    site, openPlan:new Date(document.getElementById('oOpen').value+'T12:00:00').getTime(),
    manager:document.getElementById('oMgr').value.trim()||state.user.name,
    createdAt:now(), stage:'DRAWING', stageAt:now(), drawingCount:oNewDrawings.length, comments:[],
    history:[{ts:now(), actor:actorLabel(), action:`발주 등록 · 도면 ${oNewDrawings.length}매 제공`}]
  };
  const btn = document.getElementById('oSubmit');
  if(btn){ btn.disabled=true; btn.innerHTML='<span class="spin"></span> 등록 중…'; }
  try{
    await store.saveOrder(o);
    let saved=0;
    for(const dw of oNewDrawings){
      try{ await store.addFile('O:'+id, {kind:'drawing', name:dw.name, data:dw.data, ts:now()}); saved++; }
      catch(e){ console.warn('drawing', e); }
    }
    if(saved !== oNewDrawings.length) await store.updateOrder(id, {drawingCount:saved});
    filesLoaded['O:'+id]=true;
    oNewDrawings = [];
    /* 실시간 구독이 아직 반영 전이어도 바로 보이도록 로컬에 먼저 넣는다 */
    if(!state.orders.some(x=>x.id===id)){ state.orders = [{...o, drawingCount:saved}, ...state.orders]; }
    state.ordersReady = true;
    toast(`${o.supplier}에 견적이 요청되었습니다`);
    goOrder(id);
  }catch(e){
    toast('저장 실패: '+(e.code||e.message));
    if(btn){ btn.disabled=false; btn.textContent='발주 등록 · 견적 요청'; }
  }
}
async function oAddDrawing(id, inp){
  const o = O(id); if(!o) return;
  let n=0;
  for(const f of [...inp.files]){
    try{
      const d = f.type.startsWith('image/') ? await compressImage(f,1600,0.72) : await readSmallFile(f);
      await store.addFile('O:'+id, {kind:'drawing', name:f.name, data:d, ts:now(), by:actorLabel()}); n++;
    }catch(e){ toast('도면 처리 실패: '+e.message); }
  }
  inp.value='';
  filesLoaded['O:'+id]=true;
  if(n){
    try{ await store.updateOrder(id, {drawingCount:(o.drawingCount||0)+n}, oEntry(`도면 ${n}매 추가 제공`)); }
    catch(e){ toast('저장 실패: '+(e.code||e.message)); }
  }
  render();
}
const oEntry = action => ({ts:now(), actor:actorLabel(), action});
async function addOCmt(id){
  const el = document.getElementById('oCmtIn');
  const t = el.value.trim(); if(!t) return;

/* 조명은 색온도·외경·타공, 타일은 규격·재질을 한 줄로 */
function oqSpecLine(x){
  const ok = v => v && !/^[-–—]$/.test(String(v).trim());   // PDF의 '-' 표기는 빈 값으로 본다
  const p = [];
  if(x.mk) p.push(x.mk);          // 계약 시행 전 — 규격에 공급업체(도도조명) 표기
  if(x.g==='조명'){
    if(ok(x.k)) p.push(x.k);
    if(ok(x.w)) p.push(x.w);
    if(ok(x.sz)) p.push('외경 '+x.sz);
    if(ok(x.cut)) p.push('타공 '+x.cut);
  } else {
    if(ok(x.sz)) p.push(x.sz);
    if(ok(x.mat)) p.push(x.mat);
    if(ok(x.pl)) p.push(x.pl);
  }
  return p.join(' · ');
}
function oqPickAdd(code){
  const x = specFindAt(oqPickCat, code, oRefTs(O(oqPickFor)));
  if(!x) return;
  const dup = oQItems.find(it=>it.code===code);
  if(dup){ dup.qty = (+dup.qty||0)+1; }
  else oQItems.push({
    code:x.c, name:x.n||x.c, spec:oqSpecLine(x), unit:x.u||'EA', qty:1, price:x.p||0,
    img:x.img, kelvin:x.k||'', size:x.sz||'', cut:x.cut||'', brand:x.b||'', maker:x.mk||''
  });
  toast(`${code} 추가됨`);
  oqBackToQuote();
}

let oqFileData=null, oqFileName=null;
async function oqPickFile(inp){
  const f = inp.files[0]; if(!f) return;
  const label = document.getElementById('oqFn');
  try{
    if(/\.xlsx$/i.test(f.name)){
      const rows = await parseXlsx(await f.arrayBuffer());
      const items = parseQuoteItems(rows);
      oqAnalysis = analyzeEstimate(rows, null);
      if(items.length){
        /* 엑셀의 품명·코드가 표준 품목과 맞으면 사진·스펙까지 붙여준다 */
        await loadSpec();
        const o = O(oqPickFor) || null;
        const cat = o ? o.cat : '조명';
        const refTs = oRefTs(o);
        oQItems = items.map(x=>{
          const raw = (window.SPEC_MASTER||[]).find(m=>m.g===cat &&
            (m.c.toLowerCase()===String(x.name).trim().toLowerCase() ||
             String(x.name).toUpperCase().includes(m.c)));
          const hit = specAt(raw, refTs);
          return hit
            ? {code:hit.c, name:hit.n||hit.c, spec:oqSpecLine(hit), unit:hit.u||x.unit, qty:x.qty,
               price:x.price||hit.p, img:hit.img, kelvin:hit.k||'', size:hit.sz||'', cut:hit.cut||'',
               brand:hit.b||'', maker:hit.mk||''}
            : {name:x.name, spec:x.spec, unit:x.unit, qty:x.qty, price:x.price};
        });
        oqRender();
        const matched = oQItems.filter(x=>x.code).length;
        label.textContent = `📊 ${f.name} — ${items.length}개 품목 인식${matched?` (표준품목 ${matched}건 자동연결)`:''}`;
        toast(`품목 ${items.length}건을 불러왔습니다`);
      } else {
        label.textContent = `📊 ${f.name} — 표 인식 실패 (품목은 직접 입력해주세요)`;
        toast('표준 양식의 제목행(품명·규격·단위·수량·단가·금액)을 확인해주세요');
      }
      oqAnalysisRender();
      try{ oqFileData = await readSmallFile(f); }
      catch(err){ oqFileData = null; toast('견적 내용은 반영됐지만 파일 첨부는 용량 초과로 생략됩니다'); }
    }
    else if(f.type.startsWith('image/')){ oqFileData = await compressImage(f,1400,0.72); label.textContent='📎 '+f.name; }
    else { oqFileData = await readSmallFile(f); label.textContent='📎 '+f.name; }
    oqFileName = f.name;
  }catch(e){ oqFileData=null; toast(e.message||'파일 처리 실패'); }
  inp.value = '';
}
async function oQuoteSave(id){
  const o = O(id); if(!o) return;
  const items = oQItems.filter(x=>x.name && +x.qty>0 && +x.price>0)
    .map(x=>{
      const it = {name:x.name, spec:x.spec, unit:x.unit||'EA', qty:+x.qty, price:+x.price, amount:(+x.qty)*(+x.price)};
      if(x.code){ it.code=x.code; it.brand=x.brand||''; it.img=x.img||''; }
      if(x.maker) it.maker=x.maker;
      if(x.kelvin) it.kelvin=x.kelvin;
      if(x.size) it.size=x.size;
      if(x.cut) it.cut=x.cut;
      return it;
    });
  if(!items.length){ toast('품목을 1개 이상 입력해주세요 (수량·단가 필수)'); return; }
  const itemsTotal = items.reduce((s,x)=>s+x.amount,0);
  const freight = oqFreight ? {...oqFreight} : null;
  const amount = itemsTotal + (freight?freight.amount:0);
  const first = !o.quote;
  const dv = document.getElementById('oqDate').value;
  const rv = document.getElementById('oqReady').value;
  const quote = { ts: dv ? new Date(dv+'T12:00:00').getTime() : now(),
              readyDate: rv ? new Date(rv+'T12:00:00').getTime() : null,
              items, itemsTotal, freight, amount, fileName:oqFileName||'',
              note:document.getElementById('oqNote').value.trim(),
              analysis: oqAnalysis || null };
  const patch = { quote };
  if(o.stage==='DRAWING'){ patch.stage='QUOTE'; patch.stageAt=now(); }
  const fd = oqFileData, fn = oqFileName;
  oqFileData=null; oqFileName=null; oqAnalysis=null; oqFreight=null;
  try{
    await store.updateOrder(id, patch, oEntry(`${first?'견적서 제출':'견적 수정'} (${money(amount)} · ${items.length}개 품목)`));
    if(fd){
      try{ await store.addFile('O:'+id, {kind:'quote', name:fn||'견적서', data:fd, ts:now(), by:actorLabel()}); }
      catch(fe){ toast('견적은 저장됐지만 파일 첨부에 실패했습니다: '+(fe.code||fe.message)); }
    }
    closeModal(); toast('견적서가 제출되었습니다');
  }catch(e){ toast('저장 실패: '+(e.code||e.message)); }
}

function initSignPad(cvId, hintId){
  rcSgCv = document.getElementById(cvId); if(!rcSgCv) return;
  const w = rcSgCv.offsetWidth, h = rcSgCv.offsetHeight, dpr = window.devicePixelRatio||1;
  rcSgCv.width = w*dpr; rcSgCv.height = h*dpr;
  rcSgCtx = rcSgCv.getContext('2d');
  rcSgCtx.scale(dpr,dpr);
  rcSgCtx.fillStyle='#fff'; rcSgCtx.fillRect(0,0,w,h);
  rcSgCtx.strokeStyle='#1F2430'; rcSgCtx.lineWidth=2.5; rcSgCtx.lineCap='round'; rcSgCtx.lineJoin='round';
  const pos = e => { const r=rcSgCv.getBoundingClientRect(); return {x:e.clientX-r.left, y:e.clientY-r.top}; };
  rcSgCv.addEventListener('pointerdown', e=>{ e.preventDefault(); rcSgCv.setPointerCapture(e.pointerId); rcSgPrev=pos(e); rcSgDirty=true; const hh=document.getElementById(hintId); if(hh) hh.style.display='none'; });
  rcSgCv.addEventListener('pointermove', e=>{ if(!rcSgPrev) return; e.preventDefault(); const p=pos(e); rcSgCtx.beginPath(); rcSgCtx.moveTo(rcSgPrev.x,rcSgPrev.y); rcSgCtx.lineTo(p.x,p.y); rcSgCtx.stroke(); rcSgPrev=p; });
  const up = ()=>{ rcSgPrev=null; };
  rcSgCv.addEventListener('pointerup', up); rcSgCv.addEventListener('pointercancel', up);
}
function rcClear(){
  if(!rcSgCtx) return;
  rcSgCtx.fillStyle='#fff'; rcSgCtx.fillRect(0,0,rcSgCv.offsetWidth,rcSgCv.offsetHeight);
  rcSgDirty=false; const h=document.getElementById('rcHint'); if(h) h.style.display='flex';
}

/* ── 공급사 정산·청구 화면 ──
   직영점분은 본사에 일괄 청구, 가맹점분은 시공사별로 개별 청구한다 */
function vSupplySettle(){
  const ym = state.settleMonth || ymOf(now());
  const all = visibleOrders().filter(o=>o.receipt);            // 납품확인서가 나온 건만 청구 대상
  const waiting = all.filter(o=>o.stage==='DELIVERED');
  const done = all.filter(o=>o.stage==='SETTLED' && o.settle && o.settle.month===ym);
  const sum = a => a.reduce((s,o)=>s+(oAmount(o)||0),0);

  /* 청구처별로 묶기 — 본사 1개 + 시공사 N개 */
  const groups = {};

    (a.type==='직영점'?0:1)-(b.type==='직영점'?0:1) || sum(b.list)-sum(a.list));

    <div class="kv"><b style="width:118px">청구 대기</b><strong>${money(sum(waiting))}</strong>

    <div class="kv"><b style="width:118px">${ymLabel(ym)} 수금완료</b><strong style="color:var(--green)">${money(sum(done))}</strong></div>
    <label>정산 귀속월</label>
    <input type="month" value="${ym}" onchange="state.settleMonth=this.value;render()">
    <button class="btn sec2 blk" onclick="exportBillCSV()">⬇ 청구 내역 CSV 내려받기</button>
  </div>

      <div class="note" style="margin:0 0 4px">${oBillNote(g.list[0])} · ${g.list.length}건 · 합계 <strong>${money(sum(g.list))}</strong>
        <span style="display:block;margin-top:2px">부가세 별도 금액입니다.</span></div>
      ${rowsOf(g.list)}
      <button class="btn sec2 blk" onclick="printBill('${esc(g.key).replace(/'/g,"\\'")}')">📄 거래명세서 출력 (PDF 저장)</button>

    <div class="note" style="margin:0 0 4px">합계 <strong>${money(sum(done))}</strong></div>
    ${rowsOf(done)}
  </div>`;
}
function exportBillCSV(){
  const rows = visibleOrders().filter(o=>o.receipt).map(o=>[
    o.id, oBillTo(o), o.type, o.cat, o.site, o.builder,
    fmtD(o.receipt.receivedAt), o.receipt.allOk?'이상없음':'이상: '+(o.receipt.shortItems||''),
    oAmount(o), O_NM[o.stage]||o.stage, o.settle?o.settle.month:'', o.settle?fmtD(o.settle.at):''
  ]);
  const head = ['발주번호','청구처','구분','품목','현장','시공사','납품일','검수','청구금액(VAT별도)','상태','정산월','정산일'];
  const csv = '﻿'+[head,...rows].map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download=`청구내역_${myCo()}.csv`; a.click();
  toast('CSV 파일이 다운로드되었습니다');
}

function vSettle(){
  if(role()==='supplier') return vSupplySettle();
  if(role()==='builder')  return vBuilderSettle();
  const list = visibleOrders();
  const ym = state.settleMonth || ymOf(now());
  /* 정산 대기: 납품 완료 건 / 정산 완료: 해당 월 귀속 건 */
  const waiting = list.filter(o=>o.stage==='DELIVERED' && oIsDir(o));
  const done = list.filter(o=>o.stage==='SETTLED' && oIsDir(o) && o.settle && o.settle.month===ym);
  const frWait = list.filter(o=>o.stage==='DELIVERED' && !oIsDir(o));
  const bySupplier = {};
  waiting.concat(done).forEach(o=>{
    const k = o.supplier;
    if(!bySupplier[k]) bySupplier[k] = {wait:0, waitAmt:0, done:0, doneAmt:0};
    if(o.stage==='DELIVERED'){ bySupplier[k].wait++; bySupplier[k].waitAmt += oAmount(o)||0; }
    else { bySupplier[k].done++; bySupplier[k].doneAmt += oAmount(o)||0; }
  });
  const dirWait = waiting;
  const sumOf = a => a.reduce((s,o)=>s+(oAmount(o)||0),0);

  const rowsOf = (arr) => arr.length ? arr.map(o=>`

      <div class="oline"><span class="badge b-gray">${CAT_ICON[o.cat]} ${o.cat}</span>
        <span class="badge ${o.type==='직영점'?'b-blue':'b-gray'}">${o.type}</span>
        ${o.receipt&&!o.receipt.allOk?'<span class="badge b-red">납품 이상</span>':''}</div>
      <div style="font-weight:700;font-size:13.5px;margin-top:3px">${esc(o.site)} <span style="color:var(--sub);font-weight:500">· ${esc(o.supplier)}</span></div>

      <div style="font-size:12.5px;color:var(--sub)">${o.id} · 수령 ${o.receipt?fmtD(o.receipt.receivedAt):'-'} · <strong style="color:var(--ink)">${money(oAmount(o))}</strong></div>
    </button>`).join('') : '<div class="empty">해당 건이 없습니다</div>';

  return oRoleNote()+`
  <div class="card">
    <div class="h2">📊 정산 관리</div>
    <label>정산 귀속월</label>
    <input type="month" value="${ym}" onchange="state.settleMonth=this.value;render()">
    <div class="tscroll"><table class="itab" style="margin-top:12px">
      <thead><tr><th>공급사</th><th class="num">정산대기</th><th class="num">대기금액</th><th class="num">${ymLabel(ym)} 완료</th><th class="num">완료금액</th></tr></thead>
      <tbody>${SUPPLIERS.map(sp=>{
        const b = bySupplier[sp]||{wait:0,waitAmt:0,done:0,doneAmt:0};
        return `<tr><td style="font-weight:700">${CAT_ICON[CAT_OF[sp]]} ${esc(sp)}</td>
          <td class="num">${b.wait}건</td><td class="num">${b.waitAmt.toLocaleString('ko-KR')}</td>
          <td class="num">${b.done}건</td><td class="num">${b.doneAmt.toLocaleString('ko-KR')}</td></tr>`;
      }).join('')}</tbody>
      <tfoot><tr><td>합계</td>
        <td class="num">${waiting.length}건</td><td class="num">${sumOf(waiting).toLocaleString('ko-KR')}</td>

    </table></div>
    <button class="btn sec2 blk" onclick="exportSettleCSV()">⬇ 정산 내역 CSV 내려받기</button>
  </div>

  <div class="card">

    <div class="note" style="margin:0 0 4px">납품확인서 서명이 완료된 건입니다. 월단위로 묶어 정산합니다. 합계 <strong>${money(sumOf(dirWait))}</strong></div>

    <div class="note" style="margin:0 0 4px">가맹 방식 건입니다. <b>시공사가 공급사에 직접 지급</b>하므로 본사 정산 대상이 아닙니다. (참고용)
      합계 <strong>${money(sumOf(frWait))}</strong></div>
    ${rowsOf(frWait)}

        <td style="${box}text-align:center">${esc(x.unit||'')}</td><td style="${box}text-align:right">${x.qty.toLocaleString('ko-KR')}</td>
        <td style="${box}text-align:right">${x.price.toLocaleString('ko-KR')}</td><td style="${box}text-align:right">${x.amount.toLocaleString('ko-KR')}</td></tr>`).join('')}
      <tr style="font-weight:800;background:#f8f8f8"><td style="${box}" colspan="5">합계</td><td style="${box}text-align:right">${total.toLocaleString('ko-KR')}원</td></tr>
    </table>
    <div style="font-weight:800;font-size:11pt;margin:16px 0 6px">■ 검수 결과</div>
    <table style="width:100%;border-collapse:collapse;font-size:11pt">
      <tr><td style="${box}background:#f2f2f2;width:100px;font-weight:700">검수</td>
          <td style="${box}" colspan="3">${o.receipt.allOk?'전 품목 이상 없이 수령':'⚠ 이상 있음 — '+esc(o.receipt.shortItems||'')}</td></tr>
      <tr><td style="${box}background:#f2f2f2;font-weight:700">비고</td><td style="${box}" colspan="3">${esc(o.receipt.note||'-')}</td></tr>
    </table>
    ${photos.length?`<div style="font-weight:800;font-size:11pt;margin:16px 0 6px">■ 납품 사진 (${photos.length}장)</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">${photos.slice(0,6).map(f=>`<img src="${f.data}" style="width:160px;height:120px;object-fit:cover;border:1px solid #999">`).join('')}</div>`:''}
    <div style="margin-top:22px;font-size:11pt;line-height:1.9">
      위 물품을 정히 수령하였음을 확인합니다.
      <div style="text-align:center;margin-top:6px;font-size:12pt;font-weight:700">${fmtD(o.receipt.signAt)}</div>
    </div>
    <table style="width:100%;border-collapse:collapse;font-size:11pt;margin-top:12px">
      <tr><td style="${box}background:#f2f2f2;width:100px;font-weight:700">수령자</td>
          <td style="${box}">${esc(o.receipt.receiver)}</td>
          <td style="${box}background:#f2f2f2;width:80px;font-weight:700">서명</td>
          <td style="${box}">${sg?`<img src="${sg.data}" style="height:60px">`:'(서명 이미지 없음)'}</td></tr>
    </table>
    <div style="margin-top:20px;font-size:9pt;color:#777;text-align:right">본 확인서는 GRS 보수ON에서 ${fmtDT(now())}에 자동 생성되었습니다.</div>
  </div>`;
  const imgs = document.getElementById('printArea').querySelectorAll('img');
  Promise.all([...imgs].map(im=>im.complete?1:new Promise(res=>{im.onload=im.onerror=res;}))).then(()=>window.print());
}

/* ===== 서버 연결 진단 =====
   사진이 안 보이는 원인(권한 / 용량 / 네트워크)을 화면에서 바로 확인 */
async function runDiag(){
  const out = document.getElementById('diagOut');
  const rows = [];
  const line = (ok, label, detail) => rows.push(
    `<div class="kv" style="align-items:flex-start"><b style="width:26px">${ok===null?'⏳':ok?'✅':'❌'}</b>
     <span style="flex:1"><b style="width:auto;color:var(--ink)">${label}</b>${detail?`<div style="font-size:12px;color:var(--sub);margin-top:2px;word-break:break-all">${esc(detail)}</div>`:''}</span></div>`);
  const paint = () => out.innerHTML = `<div class="sec" style="margin-top:12px">${rows.join('')}</div>`;

  out.innerHTML = `<div class="note" style="margin-top:12px"><span class="spin dk"></span> 진단 중…</div>`;

  if(!LIVE){ out.innerHTML = `<div class="note warn" style="margin-top:12px">데모 모드입니다. Firebase 설정이 없어 저장되지 않습니다.</div>`; return; }
  line(!!window.FB, 'Firebase SDK 로드', window.FB ? '정상' : (window.FB_LOAD_ERROR||'실패'));
  line(!!fs, 'Firestore 연결', fs ? `프로젝트 ${FIREBASE_CONFIG.projectId} / DB "${FIRESTORE_DB_ID}"` : '미연결');
  line(!state.dbError, '접수 목록 읽기', state.dbError ? String(state.dbError) : `${state.reqs.length}건 수신`);
  paint();
  if(!fs){ return; }

  const testId = '__diag__';
  /* 1) 하위 컬렉션 쓰기 */
  let wrote = false;
  try{
    await FB.addDoc(FB.collection(fs,'requests',testId,'files'), {kind:'diag', name:'diag.txt', data:'data:text/plain;base64,'+btoa('ok'), ts:now()});
    wrote = true; line(true, '첨부파일 저장 (requests/{id}/files 쓰기)', '정상');
  }catch(e){
    const c = e.code||String(e);
    line(false, '첨부파일 저장 (requests/{id}/files 쓰기)',
      c.includes('permission-denied') ? '권한 거부 — 보안 규칙에 files 하위 컬렉션 쓰기 허용이 없습니다' : c);
  }
  paint();
  /* 2) 하위 컬렉션 목록 조회 (list 권한 — 사진이 안 보이는 가장 흔한 원인) */
  try{
    const snap = await FB.getDocs(FB.collection(fs,'requests',testId,'files'));
    line(true, '첨부파일 목록 조회 (files 읽기/list)', `${snap.size}건 조회됨`);
  }catch(e){
    const c = e.code||String(e);
    line(false, '첨부파일 목록 조회 (files 읽기/list)',
      c.includes('permission-denied')
        ? '★ 권한 거부 — 이것이 「사진 불러오는 중」의 원인입니다. Firestore 보안 규칙에 match /requests/{id}/files/{fileId} 읽기 허용을 추가하세요 (하위 컬렉션은 상위 규칙을 물려받지 않습니다)'
        : c);
  }
  paint();
  /* 3) 실제 접수건의 첨부파일 조회 */
  const real = state.reqs.find(r=>(r.photoCount||0)>0);
  if(real){
    await store.getFiles(real.id, true);
    const n = (filesCache[real.id]||[]).length;
    line(!filesErr[real.id] && n>0, `실제 접수건 첨부 조회 (${real.id})`,
      filesErr[real.id] ? String(filesErr[real.id]) : `사진 ${real.photoCount}장 등록 / 파일 ${n}건 조회됨${n<real.photoCount?' — 업로드 당시 저장 실패로 보입니다':''}`);
  }
  /* 4) 브라우저 알림 */
  const perm = (typeof Notification==='undefined') ? '미지원' : Notification.permission;
  line(perm==='granted', '브라우저 알림 권한', perm==='granted'?'허용됨':perm==='denied'?'차단됨 — 브라우저 설정에서 허용 필요':'아직 요청하지 않음');
  line(!!navigator.serviceWorker, '서비스 워커(PWA)', navigator.serviceWorker ? '사용 가능' : '미지원');
  paint();
  toast('진단이 완료되었습니다');
}

/* ===== CSV ===== */
function exportCSV(){
  const head = ['접수번호','접수유형','오픈일','오픈요청구분','오픈시공사','점포','공사명','긴급도','담당부서','시공업체','접수일','현재단계','기한상태','견적금액','실측일','공사시작','공사종료','일정승인','작업시작(실제)','작업종료(실제)','완료일','만족도','만족도사유','견적반려횟수','기한초과이력','중단사유'];
  const rows = state.reqs.map(r=>{
    const last = (r.estimates||[])[(r.estimates||[]).length-1];
    const d = ddays(r);
    const od = (r.overdues||[]).map(o=>`${STAGE_NM[o.stage]||o.stage} ${o.days}일`).join('; ');
    return [r.id, REQ_KIND_NM[r.kind||'fix'], r.openDate?fmtD(r.openDate):'', r.openType||'', r.builder||'',
      r.store, r.title, r.urgency, r.dept||'', reqVendor(r), fmtD(r.createdAt), waitLabel(r),
      (r.stage==='DONE'||r.stage==='DROPPED')?'-':(d<0?`기한초과 ${-d}일`:`D-${d}`), last?last.amount:'',
      r.surveySkipped?'미실측('+(r.surveySkipReason||'')+')':(r.surveyDate?fmtD(r.surveyDate):''), r.constStart?fmtD(r.constStart):'', r.constEnd?fmtD(r.constEnd):'',
      r.schedStatus==='승인'?`승인(${r.schedBy||''})`:(r.schedStatus||''), r.workStart?fmtDT(r.workStart):'', r.workEnd?fmtDT(r.workEnd):'', r.completedAt?fmtD(r.completedAt):'',
      r.rating||'', r.ratingReason||'', r.rejectCount||0, od, r.dropReason||''];
  });
  const csv = '\uFEFF'+[head,...rows].map(row=>row.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download = '보수공사현황.csv'; a.click();
  toast('CSV 파일이 다운로드되었습니다');
}

/* ===== 시작 ===== */
(async function(){
  try{
    await store.init(()=>render());
  }catch(e){
    state.ready=true; state.dbError = e.code||e.message;
  }
  loadDraft();   // 작성 중이던 신규 접수 내용 복원
  if(LIVE){
    const sess = loadSession();
    if(sess && sess.role){ state.user = sess; subscribeReqs(state._onReqs); subscribeOrders(); subscribePosts(); loadChatPrefs(); ensureRooms(); }
  } else {
    state.user = {role:'hq', name:'본사담당', store:'', co:''}; // 데모: 본사 화면으로 시작
    loadChatPrefs(); ensureRooms();
  }
  if(state.user && !canApp(state.app)) state.app = myApps()[0];
  if(isOrderApp(state.app) && state.view==='dash') state.view='odash';
  render();
  // 1분마다 D-day/기한초과 재계산
  setInterval(()=>{ if(state.user && !modalOpen()) render(); }, 60000);
})();
</script>
